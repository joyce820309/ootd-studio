<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>手機我的</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=LXGW+Marker+Gothic&amp;family=Chiron+GoRound+TC:wght@400;500;700&amp;family=Nunito:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF4E8}
*{font-synthesis-weight:none}
*{box-sizing:border-box}
.hd{font-family:'LXGW Marker Gothic','Chiron GoRound TC',sans-serif;font-weight:400}
.logo{font-family:Fredoka,'Chiron GoRound TC',sans-serif}
.num{font-family:Nunito,'Chiron GoRound TC',sans-serif;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:10px;font:500 14px 'Chiron GoRound TC',sans-serif;border:1.5px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-p{background:#3B2F25;color:#FBF4E8}
.btn-o{background:#F2CF8E;color:#3B2F25;border-color:#E2B866}
.btn-s{background:#FFFCF6;border-color:#D9C7AC;color:#3B2F25}
.btn-g{background:transparent;color:#5A4A3C}
.ibtn{width:44px;height:44px;border:0;border-radius:10px;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.paper{background:#FFFCF6;border-radius:14px;box-shadow:0 1px 0 rgba(59,47,37,.05),0 12px 24px -14px rgba(59,47,37,.22)}
.lbl{display:inline-flex;align-items:center;height:32px;padding:0 12px;font:400 17px 'LXGW Marker Gothic','Chiron GoRound TC';color:#3B2F25;border-radius:3px;box-shadow:0 2px 4px rgba(59,47,37,.10)}
.tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;flex:none}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav-a{display:inline-flex;align-items:center;height:50px;padding:0 12px;border-bottom:4px solid transparent;font:500 15px 'Chiron GoRound TC';color:#5A4A3C;text-decoration:none}
dl{margin:0}
dl div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1.5px dashed #EADCC6;font-size:13px}
dt{color:#5A4A3C;flex:none}
dd{margin:0;font-weight:500;text-align:right}
.trow{display:grid;grid-template-columns:64px 52px 88px 64px minmax(160px,1fr) 70px;align-items:center;gap:10px;min-height:52px;border-top:1.5px dashed #EADCC6;font-size:14px}
.sticky{position:relative;padding:28px 22px 26px 24px;border-radius:3px;box-shadow:0 1px 0 rgba(59,47,37,.05),0 14px 22px -14px rgba(36,66,77,.4)}
.fold{position:absolute;right:0;bottom:0;width:26px;height:26px;border-radius:0 0 0 4px}
.tape{position:absolute;left:50%;top:-11px;width:96px;height:24px;margin-left:-48px;background:rgba(240,196,118,.62);transform:rotate(-3deg);box-shadow:0 1px 2px rgba(59,47,37,.08)}
.edit{position:absolute;right:8px;top:8px;width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#24424D;display:flex;align-items:center;justify-content:center;cursor:pointer}
ul.bn{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ul.bn li{position:relative;padding-left:18px;font-size:14px;line-height:1.85;color:#24323A}
ul.bn li::before{content:"";position:absolute;left:3px;top:10px;width:6px;height:6px;border-radius:50%;background:var(--dot,#3E6270)}
ul.bn b{font-weight:700}
.sw{position:relative;display:inline-block;width:42px;height:24px;border-radius:999px;flex:none}
.sw span{position:absolute;top:2px;width:20px;height:20px;border-radius:50%;background:#FFFCF6;box-shadow:0 1px 2px rgba(59,47,37,.25)}
.chip{display:inline-flex;align-items:center;gap:4px;height:38px;padding:0 14px;border-radius:999px;border:1.5px solid #E2D2B8;background:#FFFCF6;font:500 13px 'Chiron GoRound TC';color:#3B2F25;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:#3B2F25;border-color:#3B2F25;color:#FBF4E8}
:focus-visible{outline:2.5px solid #3E6270;outline-offset:2px}
a{color:#3E6270}
.row{display:flex;align-items:center;gap:12px;min-height:60px;padding:0 8px 0 14px;border-top:1.5px dashed #EADCC6;color:#3B2F25;text-decoration:none;font-size:15px}
.gh{margin:0;padding:12px 14px 6px;font-size:12px;font-weight:500;color:#74624F}
.fx{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:10px;background:#FBF4E8}
.mi{display:flex;align-items:center;height:48px;border:1.5px solid #E2D2B8;border-radius:12px;background:#FBF4E8;padding:0 12px;gap:6px}
.mi input{flex:1;min-width:0;width:100%;border:0;background:transparent;font:700 17px Nunito,'Chiron GoRound TC';color:#3B2F25;text-align:right;outline:none}
.mi span{font-size:12px;color:#74624F}
</style>
</helmet>
<div style="width:390px;height:1200px;background:#FBF4E8;color:#3B2F25;font-family:'Chiron GoRound TC',sans-serif;position:relative;overflow:hidden">
  <header style="display:flex;align-items:center;gap:4px;padding:8px 8px 8px 4px;border-bottom:1.5px dashed #D9C7AC">
    <a href="B-M-Home.dc.html" aria-label="返回首頁" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#3B2F25"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <h1 class="hd" style="margin:0;font-size:22px">我的</h1>
    <span class="num" style="margin-left:8px;font-size:11px;color:#74624F">/me</span>
  </header>

  <main style="padding:14px 12px 40px;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;align-items:center;gap:12px;padding:4px 4px 2px">
      <span style="width:52px;height:52px;border-radius:50%;background:#3B2F25;color:#FBF4E8;display:flex;align-items:center;justify-content:center;font:600 20px Fredoka">J</span>
      <span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:17px;font-weight:700">Joyce</span><span style="font-size:12px;color:#5A4A3C">衣櫃 <span class="num">86</span> 件・日記 <span class="num">8</span> 天</span></span>
    </div>

    <section aria-labelledby="mb" class="paper" style="padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 4px 0 0 #A9C6CF,0 12px 24px -14px rgba(59,47,37,.22)">
      <div style="display:flex;align-items:baseline;gap:8px"><h2 id="mb" class="hd" style="margin:0;font-size:20px">體態與尺寸</h2><span style="font-size:11px;color:#74624F">只有你看得到</span></div>
      <a href="B-M-History-Detail.dc.html" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#FBF4E8;color:#3B2F25;text-decoration:none">
        <span style="flex:1;display:flex;flex-direction:column;gap:3px"><span style="font-size:12px;color:#5A4A3C">最近一次量測</span><span style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><span class="num" style="font-size:16px;font-weight:700">2026/11/12</span><span class="tag" style="height:20px;font-size:10px;background:#F3E7D4;color:#5A4A3C">早上空腹</span><span class="tag" style="height:20px;font-size:10px;background:#F6E7C6;color:#5A3F12">改了 3 項</span></span></span>
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px;color:#74624F"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <a class="btn btn-p" href="B-M-Body.dc.html" style="height:48px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M12 5v14M5 12h14"></path></svg>新增量測</a>
        <a class="btn btn-s" href="B-M-History.dc.html" style="height:48px">量測紀錄 <span class="num">4</span></a>
      </div>
    </section>

    <section aria-labelledby="mf" class="paper" style="padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 0 0 1.5px #EBD3A0">
      <div style="display:flex;align-items:center;gap:8px"><h2 id="mf" class="hd" style="margin:0;font-size:20px">固定資料</h2><span style="font-size:11px;color:#5A3F12;padding:1px 8px;border-radius:999px;background:#F6E7C6">不太會變</span>
        <button type="button" onClick="{{open}}" aria-haspopup="dialog" style="margin-left:auto;height:40px;padding:0 8px;border:0;background:none;color:#3E6270;font:500 14px 'Chiron GoRound TC'">編輯</button></div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">
        <sc-for list="{{fixed}}" as="x" hint-placeholder-count="6">
          <div class="fx" style="box-shadow:{{x.ring}}"><span style="font-size:11px;color:#5A4A3C">{{x.k}}</span><span class="num" style="font-size:15px;font-weight:700;color:{{x.c}}">{{x.v}}</span></div>
        </sc-for>
      </div>
      <span style="font-size:11px;line-height:1.6;color:#5A4A3C">改了直接更新，不會產生新的量測紀錄。</span>
    </section>

    <section aria-labelledby="ml" class="paper" style="padding:4px 0">
      <h2 id="ml" class="gh">清單管理</h2>
      <sc-for list="{{lists}}" as="l" hint-placeholder-count="3">
        <a class="row" href="{{l.href}}" style="border-top-color:{{l.bt}}"><span style="width:10px;height:10px;border-radius:3px;background:{{l.c}}"></span><span style="flex:1">{{l.t}}</span><sc-if value="{{l.dup}}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;padding:2px 8px;border-radius:999px;background:#F6E7C6;color:#5A3F12">{{l.dup}}</span></sc-if><span class="num" style="font-size:13px;color:#5A4A3C">{{l.n}}</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px;color:#74624F"><path d="M9 6l6 6-6 6"></path></svg></a>
      </sc-for>
    </section>

    <section aria-labelledby="mc" class="paper" style="padding:4px 0">
      <h2 id="mc" class="gh">衣物</h2>
      <a class="row" href="B-M-Lessons.dc.html" style="border-top:0"><span style="width:10px;height:10px;border-radius:3px;background:#E2B4A8"></span><span style="flex:1">踩雷筆記本</span><span class="num" style="font-size:13px;color:#5A4A3C">5</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px;color:#74624F"><path d="M9 6l6 6-6 6"></path></svg></a>
    </section>

    <section aria-labelledby="ms" class="paper" style="padding:4px 0">
      <h2 id="ms" class="gh">設定</h2>
      <label class="row" style="border-top:0;cursor:pointer"><span style="flex:1;display:flex;flex-direction:column;gap:2px">AI 文字預設附上體態資料<span style="font-size:11px;color:#5A4A3C">複製給 AI 時可以再取消勾選</span></span><span class="sw" aria-hidden="true" style="background:#4A6245"><span style="left:20px"></span></span><input type="checkbox" checked style="position:absolute;opacity:0;width:1px;height:1px"></label>
      <a class="row" href="#privacy"><span style="flex:1">資料怎麼使用</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px;color:#74624F"><path d="M9 6l6 6-6 6"></path></svg></a>
      <button type="button" class="row" style="width:100%;border-left:0;border-right:0;border-bottom:0;background:none;font:400 15px 'Chiron GoRound TC';color:#8E4A3E;text-align:left">登出</button>
    </section>
  </main>

  <sc-if value="{{sheet}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" onClick="{{close}}" style="position:absolute;inset:0;background:rgba(59,47,37,.42)"></div>
    <section role="dialog" aria-modal="true" aria-labelledby="fs-t" style="position:absolute;left:0;right:0;bottom:0;background:#FFFCF6;border-radius:22px 22px 0 0;padding:8px 16px 28px;display:flex;flex-direction:column;gap:14px">
      <span aria-hidden="true" style="align-self:center;width:40px;height:4px;border-radius:2px;background:#D9C7AC"></span>
      <div style="display:flex;align-items:center"><h2 id="fs-t" class="hd" style="margin:0;font-size:20px">固定資料</h2><button type="button" onClick="{{close}}" style="margin-left:auto;height:44px;padding:0 6px;border:0;background:none;color:#3E6270;font:500 15px 'Chiron GoRound TC'">完成</button></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <sc-for list="{{edit}}" as="e" hint-placeholder-count="4">
          <label style="display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:500">{{e.k}}<span class="mi" style="border-style:{{e.bs}}"><input value="{{e.v}}" placeholder="選填" inputmode="decimal"><span>cm</span></span><span style="font-size:11px;font-weight:400;color:#3E6270">{{e.hint}}</span></label>
        </sc-for>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1.5px dashed #EADCC6">
        <label style="display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;min-height:44px;cursor:pointer"><span style="flex:1">裸腳腳寬・左右不同</span><span class="sw" aria-hidden="true" style="background:#4A6245"><span style="left:20px"></span></span><input type="checkbox" checked style="position:absolute;opacity:0;width:1px;height:1px"></label>
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
          <label style="display:flex;flex-direction:column;gap:4px;font-size:12px">左腳<span class="mi"><input value="8.5" inputmode="decimal"><span>cm</span></span></label>
          <label style="display:flex;flex-direction:column;gap:4px;font-size:12px">右腳<span class="mi" style="border-color:#A7C09E;background:#F4F8F2"><input value="9.0" inputmode="decimal"><span>cm</span></span></label>
          <label style="display:flex;flex-direction:column;gap:4px;font-size:12px">腳跟寬<span class="mi"><input value="5.5" inputmode="decimal"><span>cm</span></span></label>
        </div>
        <span style="font-size:12px;color:#2E3F2B">選鞋配大的那隻：右腳 9.0 cm</span>
      </div>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1200}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sheet: false }; }
  renderVals() {
    return {
      sheet: this.state.sheet, open: () => this.setState({ sheet: true }), close: () => this.setState({ sheet: false }),
      fixed: [['身高', '162'], ['手臂長', '55'], ['腿長', '74'], ['坐姿股上', '未填'], ['腳寬 左／右', '8.5／9.0'], ['腳跟寬', '5.5']].map(([k, v]) => ({ k, v, c: v === '未填' ? '#74624F' : '#3B2F25', ring: v === '未填' ? 'inset 0 0 0 1.5px #E2D2B8' : 'none' })),
      edit: [['身高', '162', '赤腳站直'], ['手臂長', '55', '肩峰到手腕'], ['腿長（內側）', '74', '褲長看這個'], ['坐姿股上', '', '坐硬椅，腰側量到椅面']].map(([k, v, hint]) => ({ k, v, hint, bs: v ? 'solid' : 'dashed' })),
      lists: [
        { t: '品牌', n: 14, dup: '2 組可能重複', c: '#F2CF8E', href: 'B-M-Brands.dc.html', bt: 'transparent' },
        { t: '購買通路', n: 11, dup: '1 組可能重複', c: '#A9C6CF', href: 'B-M-Shops.dc.html', bt: '#EADCC6' },
        { t: '材質', n: 16, dup: '2 組可能重複', c: '#B7CBB0', href: 'B-M-Materials.dc.html', bt: '#EADCC6' }
      ]
    };
  }
}
</script>
</body>
</html>
