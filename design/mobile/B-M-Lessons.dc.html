<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>手機踩雷筆記本</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=LXGW+Marker+Gothic&amp;family=Chiron+GoRound+TC:wght@400;500;700&amp;family=Nunito:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF4E8}
*{font-synthesis-weight:none}
*{box-sizing:border-box}
.hd{font-family:'LXGW Marker Gothic','Chiron GoRound TC',sans-serif;font-weight:400}
.logo{font-family:Fredoka,'Chiron GoRound TC',sans-serif}
.num{font-family:Nunito,'Chiron GoRound TC',sans-serif;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:10px;font:500 14px 'Chiron GoRound TC',sans-serif;border:1.5px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-p{background:#3B2F25;color:#FBF4E8}
.btn-o{background:#F2CF8E;color:#3B2F25;border-color:#E2B866}
.btn-s{background:#FFFCF6;border-color:#D9C7AC;color:#3B2F25}
.btn-g{background:transparent;color:#5A4A3C}
.ibtn{width:44px;height:44px;border:0;border-radius:10px;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.paper{background:#FFFCF6;border-radius:14px;box-shadow:0 1px 0 rgba(59,47,37,.05),0 12px 24px -14px rgba(59,47,37,.22)}
.lbl{display:inline-flex;align-items:center;height:32px;padding:0 12px;font:400 17px 'LXGW Marker Gothic','Chiron GoRound TC';color:#3B2F25;border-radius:3px;box-shadow:0 2px 4px rgba(59,47,37,.10)}
.tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;flex:none}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav-a{display:inline-flex;align-items:center;height:50px;padding:0 12px;border-bottom:4px solid transparent;font:500 15px 'Chiron GoRound TC';color:#5A4A3C;text-decoration:none}
dl{margin:0}
dl div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1.5px dashed #EADCC6;font-size:13px}
dt{color:#5A4A3C;flex:none}
dd{margin:0;font-weight:500;text-align:right}
.trow{display:grid;grid-template-columns:64px 52px 88px 64px minmax(160px,1fr) 70px;align-items:center;gap:10px;min-height:52px;border-top:1.5px dashed #EADCC6;font-size:14px}
.sticky{position:relative;padding:28px 22px 26px 24px;border-radius:3px;box-shadow:0 1px 0 rgba(59,47,37,.05),0 14px 22px -14px rgba(36,66,77,.4)}
.fold{position:absolute;right:0;bottom:0;width:26px;height:26px;border-radius:0 0 0 4px}
.tape{position:absolute;left:50%;top:-11px;width:96px;height:24px;margin-left:-48px;background:rgba(240,196,118,.62);transform:rotate(-3deg);box-shadow:0 1px 2px rgba(59,47,37,.08)}
.edit{position:absolute;right:8px;top:8px;width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#24424D;display:flex;align-items:center;justify-content:center;cursor:pointer}
ul.bn{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ul.bn li{position:relative;padding-left:18px;font-size:14px;line-height:1.85;color:#24323A}
ul.bn li::before{content:"";position:absolute;left:3px;top:10px;width:6px;height:6px;border-radius:50%;background:var(--dot,#3E6270)}
ul.bn b{font-weight:700}
.sw{position:relative;display:inline-block;width:42px;height:24px;border-radius:999px;flex:none}
.sw span{position:absolute;top:2px;width:20px;height:20px;border-radius:50%;background:#FFFCF6;box-shadow:0 1px 2px rgba(59,47,37,.25)}
.chip{display:inline-flex;align-items:center;gap:4px;height:38px;padding:0 14px;border-radius:999px;border:1.5px solid #E2D2B8;background:#FFFCF6;font:500 13px 'Chiron GoRound TC';color:#3B2F25;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:#3B2F25;border-color:#3B2F25;color:#FBF4E8}
:focus-visible{outline:2.5px solid #3E6270;outline-offset:2px}
a{color:#3E6270}
.chip{height:36px;padding:0 12px;font-size:12px}
.mtab{flex:1;height:40px;border:0;border-radius:8px;background:transparent;font:500 13px 'Chiron GoRound TC';color:#5A4A3C}
.mtab[aria-selected="true"]{background:#FFFCF6;color:#3B2F25;font-weight:700;box-shadow:0 1px 2px rgba(59,47,37,.1)}
</style>
</helmet>
<div style="width:390px;height:1240px;background:#FBF4E8;color:#3B2F25;font-family:'Chiron GoRound TC',sans-serif;position:relative;overflow:hidden">
  <header style="display:flex;align-items:center;gap:4px;padding:8px 8px 8px 4px;border-bottom:1.5px dashed #D9C7AC">
    <a href="B-M-Home.dc.html" aria-label="返回我的衣櫃" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#3B2F25"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <h1 class="hd" style="margin:0;font-size:20px">踩雷筆記本</h1><span class="num" style="font-size:12px;color:#74624F;margin-left:4px">5</span>
  </header>
  <main style="padding:14px 12px 40px;display:flex;flex-direction:column;gap:14px">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="paper" style="padding:12px 14px;display:flex;flex-direction:column;gap:2px"><span style="font-size:11px;color:#5A4A3C">已退貨</span><span class="num" style="font-size:24px;font-weight:700">3 <span style="font-size:12px;font-weight:500">件</span></span><span style="font-size:11px;color:#5A4A3C">退回 <span class="num">NT$5,670</span></span></div>
      <div class="paper" style="padding:12px 14px;display:flex;flex-direction:column;gap:2px;background:#F4DDD6"><span style="font-size:11px;color:#7E3F34">最常見</span><span class="hd" style="font-size:19px;line-height:32px;color:#5E2A22">胸口太緊 2 次</span><span style="font-size:11px;color:#7E3F34">合身上衣・外套</span></div>
    </div>

    <div role="tablist" aria-label="檢視" style="display:flex;padding:3px;border-radius:10px;background:#F3E7D4">
      <button class="mtab" type="button" role="tab" aria-selected="{{t1}}" onClick="{{toList}}">覆盤紀錄</button>
      <button class="mtab" type="button" role="tab" aria-selected="{{t2}}" onClick="{{toRules}}">我的規則 <span class="num">4</span></button>
    </div>

    <sc-if value="{{isList}}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;gap:6px;overflow-x:auto;margin:0 -12px;padding:0 12px"><button class="chip" type="button" aria-pressed="true">全部</button><button class="chip" type="button" aria-pressed="false">上衣</button><button class="chip" type="button" aria-pressed="false">下身</button><button class="chip" type="button" aria-pressed="false">外套</button><button class="chip" type="button" aria-pressed="false">鞋包</button></div>
      <sc-for list="{{cards}}" as="c" hint-placeholder-count="5">
        <a href="B-M-Review.dc.html" class="paper" style="display:flex;gap:12px;padding:12px;color:#3B2F25;text-decoration:none;align-items:flex-start">
          <span style="width:64px;height:64px;border-radius:10px;background:#F3E7D4;display:flex;align-items:center;justify-content:center;flex:none"><svg viewBox="0 0 100 100" style="width:78%;height:78%" aria-hidden="true"><path d="{{c.d}}" fill="{{c.hex}}" stroke="rgba(59,47,37,.25)" stroke-width="0.8"></path></svg></span>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px">
            <span style="display:flex;align-items:center;gap:6px"><span style="font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{c.name}}</span><span class="num" style="font-size:11px;color:#5A4A3C">{{c.size}}</span><span class="num" style="margin-left:auto;font-size:11px;color:#5A4A3C">{{c.date}}</span></span>
            <span style="display:flex;gap:4px;flex-wrap:wrap"><span class="tag" style="height:20px;font-size:10px;background:{{c.obg}};color:{{c.ofg}}">{{c.out}}</span><sc-for list="{{c.rs}}" as="r" hint-placeholder-count="2"><span class="tag" style="height:20px;font-size:10px;background:#F3E7D4;color:#5A4A3C">{{r}}</span></sc-for></span>
            <span style="font-size:12px;line-height:1.55;color:#2E3F2B">{{c.ai}}</span>
          </span>
        </a>
      </sc-for>
    </sc-if>

    <sc-if value="{{isRules}}" hint-placeholder-val="{{ false }}">
      <section aria-label="我的挑選規則" class="sticky" style="background:#DCE8EC;transform:rotate(-.5deg);margin-top:8px;padding:26px 16px 22px">
        <span class="tape" aria-hidden="true" style="width:80px;margin-left:-40px"></span>
        <h2 class="hd" style="margin:0 0 2px;font-size:20px;line-height:32px;color:#24424D">我的挑選規則</h2>
        <span style="display:block;font-size:11px;color:#3E6270;margin-bottom:6px">選購、比較試搭、新增衣物時提醒</span>
        <sc-for list="{{rules}}" as="r" hint-placeholder-count="5">
          <label style="display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1.5px dashed rgba(62,98,112,.25);cursor:pointer;opacity:{{r.op}}">
            <span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:11px;color:#3E6270">{{r.scope}}</span><span style="font-size:14px;font-weight:500;color:#24323A;line-height:1.5">{{r.t}}</span></span>
            <span class="sw" aria-hidden="true" style="background:{{r.swbg}}"><span style="left:{{r.swl}}px"></span></span>
            <input type="checkbox" checked="{{r.on}}" aria-label="{{r.t}}" style="position:absolute;opacity:0;width:1px;height:1px">
          </label>
        </sc-for>
        <span class="fold" aria-hidden="true" style="background:linear-gradient(135deg,#B9D0D8 50%,#FBF4E8 50%)"></span>
      </section>
      <div role="note" style="padding:12px 14px;border-radius:12px;background:#F4DDD6;display:flex;flex-direction:column;gap:6px">
        <span style="font-size:11px;color:#7E3F34">提醒長這樣</span>
        <span style="font-size:14px;font-weight:700;color:#5E2A22">你在 ZARA 襯衫 S 踩過雷</span>
        <span style="font-size:12px;line-height:1.6;color:#5E2A22">這件 S 平放胸寬 <span class="num">45</span> cm，比你的規則少 <span class="num">2</span> cm，建議看 M。</span>
      </div>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'list' }; }
  renderVals() {
    const G = {
      shirt: 'M32 16L44 12L50 20L56 12L68 16L80 30L88 70L78 72L70 40V74H30V40L22 72L12 70L20 30Z',
      pants: 'M32 10H68L72 90H56L50 36L44 90H28Z',
      knit: 'M32 16L44 13Q50 19 56 13L68 16L80 30L88 78L78 80L70 42V86H30V42L22 80L12 78L20 30Z',
      coat: 'M30 12L44 10L50 30L56 10L70 12L84 28L90 84L80 86L72 46L74 92H26L28 46L20 86L10 84L16 28Z',
      shoe: 'M14 62V46Q24 44 34 52Q48 62 70 62Q86 62 88 72V76H14Z'
    };
    const OUT = { '已退貨': ['#F4DDD6', '#7E3F34'], '留著不穿': ['#F6E7C6', '#5A3F12'], '轉賣': ['#DCE8EC', '#24424D'] };
    const C = [
      ['ZARA 合身短版襯衫', 'S', '已退貨', '11/15', 'shirt', '#F4F1EA', ['胸口太緊', '肩膀卡'], '版型適合你，是尺寸選小了。'],
      ['UNIQLO 寬版直筒褲', 'M', '已退貨', '10/02', 'pants', '#2E3A4F', ['太長', '腰太鬆'], '褲長比你常穿的長 6 cm，腰圍可改選 S。'],
      ['網拍 羊毛混紡針織衫', 'F', '留著不穿', '09/12', 'knit', '#D9CBB3', ['刺癢', '起毛球'], '你穿得住的針織都是羊毛 ≥ 50%。'],
      ['COS 短版西裝外套', '36', '已退貨', '08/20', 'coat', '#3D3D3B', ['胸口太緊'], '胸圍鬆份 +6 cm，你的外套通常 +14 以上。'],
      ['ZARA 方頭樂福鞋', '37', '轉賣', '06/30', 'shoe', '#1F1F1E', ['太長', '腳跟掉'], '鞋內長比你的腳長多 1.3 cm，可選 36。']
    ];
    const R = [['ZARA・襯衫', 'ZARA 的襯衫選 M，不要選 S', 1], ['所有襯衫', '平放胸寬至少 47 cm', 1], ['外套', '胸圍要比上胸圍大 12 cm 以上', 1], ['針織', '羊毛低於 50% 的混紡先看實品', 1], ['褲子', '褲長不超過 98 cm', 0]];
    const st = this.state;
    return {
      isList: st.tab === 'list', isRules: st.tab === 'rules',
      t1: st.tab === 'list' ? 'true' : 'false', t2: st.tab === 'rules' ? 'true' : 'false',
      toList: () => this.setState({ tab: 'list' }), toRules: () => this.setState({ tab: 'rules' }),
      cards: C.map(([name, size, out, date, s, hex, rs, ai]) => ({ name, size, out, date, d: G[s], hex, rs, ai, obg: OUT[out][0], ofg: OUT[out][1] })),
      rules: R.map(([scope, t, on]) => ({ scope, t, on: !!on, op: on ? 1 : 0.6, swbg: on ? '#3E6270' : '#B9C9CF', swl: on ? 20 : 2 }))
    };
  }
}
</script>
</body>
</html>
