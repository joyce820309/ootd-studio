<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>手機選購比較</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=LXGW+Marker+Gothic&amp;family=Chiron+GoRound+TC:wght@400;500;700&amp;family=Nunito:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF4E8}
*{font-synthesis-weight:none}
*{box-sizing:border-box}
.hd{font-family:'LXGW Marker Gothic','Chiron GoRound TC',sans-serif;font-weight:400}
.logo{font-family:Fredoka,'Chiron GoRound TC',sans-serif}
.num{font-family:Nunito,'Chiron GoRound TC',sans-serif;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:10px;font:500 14px 'Chiron GoRound TC',sans-serif;border:1.5px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-p{background:#3B2F25;color:#FBF4E8}
.btn-o{background:#F2CF8E;color:#3B2F25;border-color:#E2B866}
.btn-s{background:#FFFCF6;border-color:#D9C7AC;color:#3B2F25}
.btn-g{background:transparent;color:#5A4A3C}
.ibtn{width:44px;height:44px;border:0;border-radius:10px;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.paper{background:#FFFCF6;border-radius:14px;box-shadow:0 1px 0 rgba(59,47,37,.05),0 12px 24px -14px rgba(59,47,37,.22)}
.lbl{display:inline-flex;align-items:center;height:32px;padding:0 12px;font:400 17px 'LXGW Marker Gothic','Chiron GoRound TC';color:#3B2F25;border-radius:3px;box-shadow:0 2px 4px rgba(59,47,37,.10)}
.tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;flex:none}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav-a{display:inline-flex;align-items:center;height:50px;padding:0 12px;border-bottom:4px solid transparent;font:500 15px 'Chiron GoRound TC';color:#5A4A3C;text-decoration:none}
dl{margin:0}
dl div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1.5px dashed #EADCC6;font-size:13px}
dt{color:#5A4A3C;flex:none}
dd{margin:0;font-weight:500;text-align:right}
.trow{display:grid;grid-template-columns:64px 52px 88px 64px minmax(160px,1fr) 70px;align-items:center;gap:10px;min-height:52px;border-top:1.5px dashed #EADCC6;font-size:14px}
.sticky{position:relative;padding:28px 22px 26px 24px;border-radius:3px;box-shadow:0 1px 0 rgba(59,47,37,.05),0 14px 22px -14px rgba(36,66,77,.4)}
.fold{position:absolute;right:0;bottom:0;width:26px;height:26px;border-radius:0 0 0 4px}
.tape{position:absolute;left:50%;top:-11px;width:96px;height:24px;margin-left:-48px;background:rgba(240,196,118,.62);transform:rotate(-3deg);box-shadow:0 1px 2px rgba(59,47,37,.08)}
.edit{position:absolute;right:8px;top:8px;width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#24424D;display:flex;align-items:center;justify-content:center;cursor:pointer}
ul.bn{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ul.bn li{position:relative;padding-left:18px;font-size:14px;line-height:1.85;color:#24323A}
ul.bn li::before{content:"";position:absolute;left:3px;top:10px;width:6px;height:6px;border-radius:50%;background:var(--dot,#3E6270)}
ul.bn b{font-weight:700}
.sw{position:relative;display:inline-block;width:42px;height:24px;border-radius:999px;flex:none}
.sw span{position:absolute;top:2px;width:20px;height:20px;border-radius:50%;background:#FFFCF6;box-shadow:0 1px 2px rgba(59,47,37,.25)}
.chip{display:inline-flex;align-items:center;gap:4px;height:38px;padding:0 14px;border-radius:999px;border:1.5px solid #E2D2B8;background:#FFFCF6;font:500 13px 'Chiron GoRound TC';color:#3B2F25;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:#3B2F25;border-color:#3B2F25;color:#FBF4E8}
:focus-visible{outline:2.5px solid #3E6270;outline-offset:2px}
a{color:#3E6270}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:12px}
.ch{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap}
.dt{display:inline-block;width:16px;height:16px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1.5px rgba(59,47,37,.18)}
.arw{width:44px;height:44px;border:0;background:none;display:inline-flex;align-items:center;justify-content:center;color:#3B2F25;cursor:pointer;flex:none}
.cell{display:flex;flex-direction:column;align-items:flex-start;gap:4px;font-size:14px;line-height:1.5;min-width:0}
.fstack{position:fixed;right:24px;bottom:24px;z-index:25;display:flex;flex-direction:column;align-items:center;gap:8px}
.fa{position:relative;width:44px;height:44px;border-radius:8px;border:1.5px solid #D9C7AC;background:#FFFCF6;color:#3B2F25;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;box-shadow:0 1px 0 rgba(59,47,37,.05),0 10px 20px -10px rgba(59,47,37,.45);transition:border-color .15s,transform .15s}
.fa svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fa:hover,.fa[data-v="hover"]{border-color:#3B2F25;transform:translateY(-1px)}
.fa[data-v="focus"]{outline:2.5px solid #3E6270;outline-offset:3px}
.fa[data-open="true"]{background:#DCE8EC;border-color:#A9C6CF;color:#24424D}
.fa.dark{background:#3B2F25;border-color:#3B2F25;color:#F2CF8E}
.fa .q{position:absolute;right:-6px;top:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:#F2CF8E;color:#3B2F25;font:700 10.5px Nunito;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #FBF4E8}
.fa .tip{position:absolute;right:54px;top:50%;transform:translateY(-50%);padding:5px 10px;border-radius:8px;background:#3B2F25;color:#FBF4E8;font:500 12px 'Chiron GoRound TC';white-space:nowrap;pointer-events:none;opacity:0}
.fa:hover .tip,.fa[data-v="hover"] .tip,.fa[data-v="focus"] .tip{opacity:1}

</style>
</helmet>
<div style="width:390px;height:2140px;background:#FBF4E8;color:#3B2F25;font-family:'Chiron GoRound TC',sans-serif;position:relative;overflow:hidden">
  <header style="display:flex;align-items:center;gap:2px;padding:6px 4px 6px 4px;border-bottom:1.5px dashed #D9C7AC">
    <a class="ibtn" href="B-M-Wishlist-Select.dc.html" aria-label="回選購清單" style="color:#3B2F25"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 class="hd" style="margin:0;font-size:21px">寬褲三選一</h1>
    <button type="button" class="ibtn" aria-label="改比較的名稱" style="color:#5A4A3C"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4"></path></svg></button>
    <button type="button" class="ibtn" aria-label="我的比較、封存、刪除" style="margin-left:auto;color:#3B2F25"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h.01M12 12h.01M18 12h.01" style="stroke-width:3"></path></svg></button>
  </header>

  <div style="display:flex;align-items:center;gap:8px;padding:2px 12px 0 16px">
    <span style="font-size:12px;color:#5A4A3C">3 件・一次看 2 件</span>
    <button type="button" role="switch" aria-checked="{{diffA}}" onClick="{{toggleDiff}}" style="margin-left:auto;display:inline-flex;align-items:center;gap:8px;height:44px;border:0;background:none;font:500 13px 'Chiron GoRound TC';color:#3B2F25;cursor:pointer"><span class="sw" aria-hidden="true" style="background:{{swBg}}"><span style="left:{{swL}}"></span></span>只看不一樣</button>
  </div>

  <div style="position:relative;z-index:2;margin:0 0 4px;padding:8px 12px 10px;background:#FBF4E8;box-shadow:0 10px 14px -14px rgba(59,47,37,.5)">
    <div class="two">
      <sc-for list="{{cols}}" as="c" hint-placeholder-count="2">
        <div style="display:flex;flex-direction:column;gap:6px;min-width:0">
          <span style="position:relative;height:120px;border-radius:12px;background:{{c.bg}};display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 100 100" style="width:60%;height:80%" aria-hidden="true"><path d="M30 8H70L80 92H56L50 36L44 92H20Z" fill="{{c.hex}}" stroke="rgba(59,47,37,.3)" stroke-width="1.5"></path></svg></span>
          <span style="display:flex;align-items:center;justify-content:space-between;margin:-2px -6px"><button type="button" class="arw" onClick="{{c.prev}}" aria-label="這欄換上一件"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button><span class="num" style="font-size:12px;color:#5A4A3C">{{c.pos}}</span><button type="button" class="arw" onClick="{{c.next}}" aria-label="這欄換下一件"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button></span>
          <span style="font-size:13px;font-weight:700;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px">{{c.name}}</span>
          <span style="display:flex;align-items:baseline;gap:6px"><b class="num" style="font-size:16px">{{c.price}}</b><span style="font-size:11px;color:#5A4A3C">{{c.size}}</span></span>
        </div>
      </sc-for>
    </div>
  </div>

  <main style="padding:0 12px 120px">
    <sc-for list="{{sections}}" as="s" hint-placeholder-count="4">
      <section style="display:flex;flex-direction:column">
        <h2 class="hd" style="margin:16px 4px 2px;font-size:18px">{{s.t}}</h2>
        <sc-for list="{{s.rows}}" as="r" hint-placeholder-count="3">
          <div style="display:flex;flex-direction:column;gap:6px;padding:10px 4px;border-top:1.5px dashed #EADCC6">
            <span style="display:flex;align-items:baseline;gap:8px;font-size:12px;color:#5A4A3C"><span>{{r.label}}</span><sc-if value="{{r.me}}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;color:#74624F">{{r.me}}</span></sc-if></span>
            <div class="two">
              <sc-for list="{{r.cells}}" as="c" hint-placeholder-count="2">
                <span class="cell"><sc-if value="{{c.isNote}}" hint-placeholder-val="{{ false }}"><span style="width:100%;padding:8px 9px;border-radius:10px;background:#EEF4F6;font-size:12px;line-height:1.7;color:#24323A;white-space:pre-line">{{c.v}}</span></sc-if><span style="display:{{c.disp}};align-items:center;gap:5px;flex-wrap:wrap"><span class="{{c.cls}}" style="font-weight:{{c.w}}">{{c.v}}</span><sc-for list="{{c.dots}}" as="d" hint-placeholder-count="0"><span class="dt" style="background:{{d.h}};outline:{{d.ol}};outline-offset:2px"></span></sc-for></span><sc-if value="{{c.chip}}" hint-placeholder-val="{{ false }}"><span class="ch" style="background:{{c.cb}};color:{{c.cf}}">{{c.chip}}</span></sc-if></span>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </section>
    </sc-for>
    <sc-if value="{{folded}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{toggleFold}}" style="display:flex;align-items:center;gap:8px;width:100%;margin-top:12px;min-height:52px;padding:8px 12px;border:1.5px dashed #D9C7AC;border-radius:12px;background:repeating-linear-gradient(-45deg,#FFFCF6 0 10px,#FBF4E8 10px 20px);font:500 13px 'Chiron GoRound TC';color:#3B2F25;text-align:left"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M7 7l5 5 5-5M7 13l5 5 5-5"></path></svg><span>還有 <b class="num">{{foldN}}</b> 區：{{foldNames}}</span></button></sc-if>
    <sc-if value="{{diff}}" hint-placeholder-val="{{ false }}"><p style="margin:12px 4px 0;padding:10px 12px;border-radius:10px;background:#F6E7C6;font-size:12px;line-height:1.7;color:#5A3F12">已收起 3 列一樣的：版型、季節、洗滌。</p></sc-if>
    <div class="two" style="margin-top:16px;padding-top:14px;border-top:2px solid #3B2F25">
      <sc-for list="{{cols}}" as="c" hint-placeholder-count="2">
        <span style="display:flex;flex-direction:column;gap:4px"><button type="button" class="btn btn-s" style="width:100%;padding:0 8px">就買這件</button><a class="btn btn-g" href="B-M-Studio.dc.html" style="padding:0 6px;color:#3E6270;font-size:13px">拿去試搭</a></span>
      </sc-for>
    </div>
    <p style="margin:12px 4px 0;font-size:12px;line-height:1.7;color:#5A4A3C">按「就買這件」會跳出跟桌機同樣的確認：其他幾件要不要改成不考慮、這個比較要不要封存。</p>
  </main>

  <div class="fstack" style="position:absolute;right:12px;bottom:96px">
    <button type="button" class="fa" aria-label="回到頂端"><svg viewBox="0 0 24 24"><path d="M6 5h12M12 19V9M7 13l5-5 5 5"></path></svg><span class="tip">回到頂端</span></button>
    <button type="button" class="fa" data-open="{{ftOpen}}" onClick="{{toggleFold}}" aria-expanded="{{ftOpen}}" aria-label="展開或收起後面幾區"><svg viewBox="0 0 24 24"><path d="{{ftPath}}"></path></svg></button>
    <button type="button" class="fa dark" aria-label="打開採購籃，2 件"><svg viewBox="0 0 24 24"><path d="M4 8h16l-1.5 11h-13zM9 8V6a3 3 0 0 1 6 0v2"></path></svg><span class="q" aria-hidden="true">2</span></button>
  </div>
  <div style="position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 12px 26px;background:#FFFCF6;border-top:1.5px dashed #D9C7AC">
    <a class="btn btn-o" href="B-M-Compare-Picker.dc.html" style="flex:1;height:48px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M12 5v14M5 12h14"></path></svg>加入商品</a>
    <button type="button" class="btn btn-s" style="flex:1;height:48px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M8 8h11v12H8zM5 16V4h11"></path></svg>整理給 AI</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":2140}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { l: 0, r: 1, diff: false, open: false }; }
  renderVals() {
    const st = this.state;
    const SAGE = ['#E6EEE2', '#3F5A3B'], ROSE = ['#F4DDD6', '#8E4A3E'], OAT = ['#F6E7C6', '#5A3F12'], MIST = ['#DCE8EC', '#24424D'], GRAY = ['#F3E7D4', '#5A4A3C'];
    const IT = [
      { name: '#802556 超顯瘦撞色收邊後鬆緊質感毛呢褲', price: 'NT$590', size: 'M', hex: '#2B2724', bg: '#F1E4E2' },
      { name: '寬版九分打褶褲', price: 'NT$990', size: 'M', hex: '#C9B48F', bg: '#F6E7C6' },
      { name: '奶油白羊毛直筒寬褲', price: 'NT$2,280', size: 'L', hex: '#F2EADB', bg: '#E6EEE2' }
    ];
    const c = (v, o) => Object.assign({ v, cls: '', w: 400, dots: [], chip: '' }, o || {});
    const n = (v, o) => c(v, Object.assign({ cls: 'num' }, o || {}));
    const ch = (t, k) => ({ chip: t, cb: k[0], cf: k[1] });
    const dots = a => a.map(([h, on]) => ({ h, ol: on ? '2px solid #3B2F25' : 'none' }));
    const S = [
      { t: '價格', rows: [
        { label: '售價', cells: [n('NT$590', Object.assign({ w: 700 }, ch('最便宜', SAGE))), n('NT$990'), n('NT$2,280')] }
      ] },
      { t: '商品頁尺寸表', rows: [
        { label: '原文照貼，不判斷', note: 1, cells: [c('S 腰31-38 臀60 長94\nM 腰33-40 臀62 長95\nL 腰35-42 臀64 長96', { note: 1 }), c('XS–XL 見官網\nM 腰36 臀52 長88', { note: 1 }), c('L 腰38 臀50 長102', { note: 1 })] }
      ] },
      { t: '尺寸 vs 我的身體', rows: [
        { label: '腰圍', me: '我 70', cells: [n('33 ↔ 40', ch('有彈性・會貼身', OAT)), n('36', ch('合身', SAGE)), n('38', ch('偏鬆', MIST))] },
        { label: '臀圍', me: '我 92', cells: [n('62', ch('寬鬆', MIST)), n('52', ch('寬鬆', MIST)), n('50', ch('合身', SAGE))] }
      ] },
      { t: '顏色', rows: [
        { label: '可選・框起來是最想要的', cells: [c('3 色', { dots: dots([['#2B2724', 1], ['#6B4A36'], ['#F3EDE1']]) }), c('2 色', { dots: dots([['#C9B48F', 1], ['#232322']]) }), c('1 色', { dots: dots([['#F3EDE1', 1]]) })] }
      ] },
      { t: '我的筆記', rows: [
        { label: '', cells: [c('撞色收邊很可愛，毛呢會不會起毛球？'), c('門市可以先試穿'), c('顏色最美，但只剩 L')] }
      ] },
      { t: '材質與版型', fold: 1, rows: [
        { label: '成分', cells: [c('聚酯 70%・羊毛 30%'), c('聚酯纖維 100%'), c('羊毛 50%・尼龍 50%')] },
        { label: '版型', same: 1, cells: [c('高腰寬褲'), c('高腰寬褲'), c('高腰寬褲')] },
        { label: '季節', same: 1, cells: [c('秋冬'), c('秋冬'), c('秋冬')] }
      ] },
      { t: '跟衣櫃', fold: 1, rows: [
        { label: '可以搭', cells: [n('12 件', Object.assign({ w: 700 }, ch('最好搭', SAGE))), n('9 件'), n('10 件')] },
        { label: '重複・衣櫃裡最像的', cells: [c('像「燕麥色高腰厚磅寬褲」・同：寬褲、高腰、厚磅', ch('很像', ROSE)), c('像「黑色高腰彈力直筒褲」・依據較少', ch('有點像', OAT)), c('衣櫃沒有淺色寬褲', ch('不太像', SAGE))] }
      ] },
      { t: '購買', fold: 1, rows: [
        { label: '退換', cells: [c('7 天', ch('換貨自付運費', ROSE)), c('30 天・門市可退'), c('7 天・自付運費')] }
      ] }
    ];
    const L = st.l, R = st.r, N = IT.length;
    const step = (cur, other, d) => { let x = cur; do { x = (x + d + N) % N; } while (x === other); return x; };
    const sameTwo = r => r.same || (r.cells[L].v === r.cells[R].v && !r.cells[L].chip && !r.cells[R].chip && !r.cells[L].dots.length);
    const all = S.map(s => ({ t: s.t, fold: !!s.fold, rows: s.rows.filter(r => !(st.diff && !r.note && sameTwo(r))).map(r => ({ label: r.label, me: r.me || '', cells: [r.cells[L], r.cells[R]].map(x => Object.assign({ note: 0 }, x, { isNote: !!x.note, disp: x.note ? 'none' : 'flex' })) })) })).filter(s => s.rows.length);
    const foldList = all.filter(s => s.fold), open = st.open;
    const sections = all.filter(s => open || !s.fold);
    const col = (i, other, key) => Object.assign({}, IT[i], { pos: `${i + 1} / ${N}`,
      prev: () => this.setState({ [key]: step(i, other, -1) }), next: () => this.setState({ [key]: step(i, other, 1) }) });
    return {
      diff: st.diff, diffA: st.diff ? 'true' : 'false', swBg: st.diff ? '#3E6270' : '#D9C7AC', swL: st.diff ? '20px' : '2px',
      toggleDiff: () => this.setState({ diff: !st.diff }),
      cols: [col(L, R, 'l'), col(R, L, 'r')], sections,
      folded: !open && foldList.length > 0, foldN: foldList.length, foldNames: foldList.map(x => x.t).join('、'), toggleFold: () => this.setState({ open: !open }),
      ftOpen: open ? 'true' : 'false', ftText: open ? '收起' : '展開', ftPath: open ? 'M7 17l5-5 5 5M7 11l5-5 5 5' : 'M7 7l5 5 5-5M7 13l5 5 5-5'
    };
  }
}
</script>
</body>
</html>
