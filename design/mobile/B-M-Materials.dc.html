<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>手機材質管理</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=LXGW+Marker+Gothic&amp;family=Chiron+GoRound+TC:wght@400;500;700&amp;family=Nunito:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF4E8}
*{font-synthesis-weight:none}
*{box-sizing:border-box}
.hd{font-family:'LXGW Marker Gothic','Chiron GoRound TC',sans-serif;font-weight:400}
.num{font-family:Nunito,'Chiron GoRound TC',sans-serif;font-variant-numeric:tabular-nums}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:999px;font-size:12px;white-space:nowrap}
.row{display:flex;align-items:center;gap:10px;min-height:60px;padding:0 4px 0 6px;border-top:1.5px dashed #EADCC6;color:#3B2F25;text-decoration:none}
:focus-visible{outline:2.5px solid #3E6270;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:960px;background:#FBF4E8;color:#3B2F25;font-family:'Chiron GoRound TC',sans-serif;position:relative;overflow:hidden;display:flex;flex-direction:column">
  <header style="display:flex;align-items:center;gap:4px;padding:8px 8px 8px 4px;border-bottom:1.5px dashed #D9C7AC">
    <a href="B-M-Lists.dc.html" aria-label="返回個人資料" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#3B2F25"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <h1 class="hd" style="margin:0;font-size:20px">材質</h1><span class="num" style="font-size:12px;color:#74624F;margin-left:4px">16</span>
    <button type="button" aria-label="新增材質" style="margin-left:auto;width:44px;height:44px;border:0;background:none;color:#3B2F25;display:flex;align-items:center;justify-content:center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
    <button type="button" style="height:44px;padding:0 10px;border:0;background:none;color:#3E6270;font:500 14px 'Chiron GoRound TC'">排序</button>
  </header>
  <main style="padding:12px 12px 40px;display:flex;flex-direction:column;gap:12px">
    <section aria-label="可能重複" style="padding:12px;border-radius:14px;background:#FFF9EE;display:flex;flex-direction:column;gap:8px">
      <span style="font-size:13px;font-weight:500">可能是同一種材質</span>
      <div style="padding:10px;border-radius:12px;background:#FFFCF6;display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="chip" style="background:#F3E7D4">聚酯纖維 <span class="num" style="color:#74624F">18</span></span><span class="chip" style="background:#F3E7D4">聚脂纖維 <span class="num" style="color:#74624F">2</span></span><span style="font-size:11px;color:#74624F">「脂」「酯」可能打錯</span></div>
        <div style="display:flex;gap:6px;align-items:center"><span style="font-size:12px;color:#5A4A3C">→ 合併成 <b style="color:#3B2F25">聚酯纖維</b></span><a href="B-M-Brands-Merge.dc.html" style="margin-left:auto;height:36px;padding:0 12px;border-radius:10px;border:1.5px solid #E2B866;background:#F2CF8E;font:500 12px 'Chiron GoRound TC';color:#3B2F25;display:flex;align-items:center;text-decoration:none">合併…</a></div>
      </div>
      <span style="font-size:11px;color:#74624F;padding-left:2px">還有 1 組：棉／Cotton</span>
    </section>
    <section aria-label="材質清單" style="border-radius:14px;background:#FFFCF6;padding:0 4px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
        <a href="B-M-Brands-Actions.dc.html" class="row" style="border-top-color:{{r.bt}};opacity:{{r.op}}">
          <span aria-hidden="true" style="width:24px;text-align:center;color:#74624F;letter-spacing:-2px;font-weight:700">⋮⋮</span>
          <span style="width:10px;height:10px;border-radius:3px;background:{{r.c}};flex:none"></span>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:500;display:flex;align-items:center;gap:6px">{{r.t}}<sc-if value="{{r.tag}}" hint-placeholder-val="{{ false }}"><span class="chip" style="height:20px;font-size:10px;background:{{r.tbg}};color:{{r.tfg}}">{{r.tag}}</span></sc-if></span><span style="font-size:11px;color:#74624F">{{r.alias}}</span></span>
          <span class="num" style="font-size:14px;font-weight:700">{{r.n}}</span>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px;color:#74624F"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
      </sc-for>
    </section>
    <span style="font-size:11px;line-height:1.6;color:#74624F;padding:0 4px">按住 ⋮⋮ 拖曳＝新增衣物時的選項順序。內建材質不能刪除，動作面板裡改成「隱藏」。</span>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const R = [['棉', '#E8DCC4', 'Cotton', 31, '預設'], ['聚酯纖維', '#A9C6CF', 'Polyester', 18, '預設'], ['彈性纖維', '#E2B4A8', 'Spandex、萊卡', 9, '預設'], ['羊毛', '#D9CBB3', 'Wool', 8, '預設'], ['尼龍', '#B7CBB0', 'Nylon', 6, '預設'], ['嫘縈', '#C9D3DC', 'Rayon', 4, '預設'], ['聚脂纖維', '#A9C6CF', '自己新增', 2, '可能重複'], ['亞麻', '#D9CBB3', 'Linen・已隱藏', 0, '預設', 1]];
    return { rows: R.map(([t, c, alias, n, tag, hid], i) => ({ t, c, alias, n, tag, op: hid ? 0.55 : 1, bt: i ? '#EADCC6' : 'transparent',
      tbg: tag === '可能重複' ? '#F6E7C6' : '#F3E7D4', tfg: tag === '可能重複' ? '#5A3F12' : '#5A4A3C' })) };
  }
}
</script>
</body>
</html>
