<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>手機 Landing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=LXGW+Marker+Gothic&amp;family=Chiron+GoRound+TC:wght@400;500;700&amp;family=Nunito:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF4E8}
*{font-synthesis-weight:none}
*{box-sizing:border-box}
.hd{font-family:'LXGW Marker Gothic','Chiron GoRound TC',serif}
.logo{font-family:Fredoka,'Chiron GoRound TC',sans-serif}
.num{font-family:Nunito,'Chiron GoRound TC',sans-serif;font-variant-numeric:tabular-nums}
.wash{position:absolute;border-radius:22px;mix-blend-mode:multiply}
.cell{position:relative;border-radius:10px;background:#FBF4E8;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0}
:focus-visible{outline:2.5px solid #3E6270;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:844px;background:#FBF4E8;color:#3B2F25;font-family:'Chiron GoRound TC',sans-serif;position:relative;overflow:hidden;display:flex;flex-direction:column">
  <header style="display:flex;align-items:center;padding:12px 12px 12px 16px;border-bottom:1.5px dashed #D9C7AC">
    <span class="logo" style="font-size:19px;font-weight:600;display:inline-block;padding:3px 10px;background:#F2CF8E;border-radius:3px;transform:rotate(-2deg);box-shadow:0 2px 4px rgba(59,47,37,.14)">My Closet</span>
    <a href="B-M-Login.dc.html" style="margin-left:auto;height:40px;padding:0 16px;border-radius:10px;border:1.5px solid #D9C7AC;color:#3B2F25;font:500 14px 'Chiron GoRound TC';text-decoration:none;display:flex;align-items:center">登入</a>
  </header>

  <main style="flex:1;padding:24px 20px 120px;display:flex;flex-direction:column;gap:18px">
    <h1 class="hd" style="margin:0;font-size:36px;font-weight:700;line-height:1.3">把衣櫃<br>收進手帳裡。</h1>
    <p style="margin:0;font-size:15px;line-height:1.85;color:#5A4A3C">勾一勾排好今天的穿搭；網拍猶豫時，把候選並排比較、再和衣櫃混搭看看。</p>

    <div aria-hidden="true" style="position:relative;height:270px">
      <span class="wash" style="left:0;top:8%;width:58%;height:70%;background:rgba(240,196,118,.5);transform:rotate(-5deg)"></span>
      <span class="wash" style="right:0;top:0;width:50%;height:54%;background:rgba(150,186,198,.48);transform:rotate(4deg)"></span>
      <span class="wash" style="right:6%;bottom:0;width:56%;height:50%;background:rgba(222,166,152,.45);transform:rotate(-3deg)"></span>
      <div style="position:absolute;left:8%;top:6%;width:62%;padding:10px;border-radius:14px;background:#FFFCF6;box-shadow:0 12px 22px -14px rgba(59,47,37,.3);transform:rotate(-2deg)">
        <span style="position:absolute;left:50%;top:-8px;margin-left:-30px;width:60px;height:16px;background:rgba(150,186,198,.75);mix-blend-mode:multiply;transform:rotate(-4deg);border-radius:2px"></span>
        <div style="display:grid;gap:4px;height:200px;grid-template-columns:1fr 1.2fr;grid-template-rows:1fr 1.05fr .65fr;grid-template-areas:'outer top' 'outer bottom' '. shoes'">
          <sc-for list="{{board}}" as="b" hint-placeholder-count="4"><div class="cell" style="grid-area:{{b.area}}"><span style="position:absolute;inset:10%;border-radius:8px;background:{{b.wash}};mix-blend-mode:multiply"></span><svg viewBox="0 0 100 100" style="position:relative;height:82%;aspect-ratio:1/1"><path d="{{b.d}}" fill="{{b.hex}}" stroke="rgba(59,47,37,.22)" stroke-width="0.8"></path></svg></div></sc-for>
        </div>
      </div>
      <div style="position:absolute;right:2%;top:46%;width:40%;padding:8px;border-radius:12px;background:#FFFCF6;box-shadow:0 12px 22px -14px rgba(59,47,37,.3);transform:rotate(3deg);display:flex;flex-direction:column;gap:4px">
        <span style="font-size:10px;color:#5A4A3C">三家寬褲比較</span>
        <span class="num" style="font-size:13px;font-weight:700">NT$1,050 起</span>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{feats}}" as="f" hint-placeholder-count="3">
        <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#FFFCF6"><span style="width:12px;height:12px;border-radius:4px;background:{{f.c}};flex:none"></span><span style="display:flex;flex-direction:column"><span class="hd" style="font-size:16px;font-weight:700">{{f.t}}</span><span style="font-size:12px;color:#5A4A3C">{{f.d}}</span></span></div>
      </sc-for>
    </div>
  </main>

  <footer style="position:absolute;left:0;right:0;bottom:0;padding:12px 16px 28px;background:#FBF4E8;border-top:1.5px dashed #D9C7AC;display:flex;flex-direction:column;gap:6px;align-items:center">
    <a href="B-M-Login.dc.html" style="width:100%;height:52px;border-radius:12px;background:#3B2F25;color:#FBF4E8;font:500 15px 'Chiron GoRound TC';text-decoration:none;display:flex;align-items:center;justify-content:center">登入我的衣櫃</a>
    <span style="font-size:11px;color:#5A4A3C">私人空間・僅限受邀帳號</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const W = { outer:'rgba(150,186,198,.35)', top:'rgba(240,196,118,.4)', bottom:'rgba(167,192,158,.42)', shoes:'rgba(222,166,152,.38)' };
    const b = (area,hex,d) => ({area,hex,d,wash:W[area]});
    return {
      board: [
        b('outer','#3D3D3B','M30 12L44 10L50 30L56 10L70 12L84 28L90 84L80 86L72 46L74 92H26L28 46L20 86L10 84L16 28Z'),
        b('top','#D9CBB3','M32 16L44 13Q50 19 56 13L68 16L80 30L88 78L78 80L70 42V86H30V42L22 80L12 78L20 30Z'),
        b('bottom','#8FA3BC','M32 10H68L72 90H56L50 36L44 90H28Z'),
        b('shoes','#2A2826','M30 14H52V56Q70 58 84 66Q90 70 88 80H30Z')
      ],
      feats: [
        {t:'整理衣櫃', d:'拍照自動去背，依分類與狀態整理', c:'#F2CF8E'},
        {t:'今日搭配', d:'依部位勾選，自動排好版', c:'#B7CBB0'},
        {t:'比較試搭台', d:'跨網站比價，和衣櫃混搭試穿', c:'#E2B4A8'}
      ]
    };
  }
}
</script>
</body>
</html>
