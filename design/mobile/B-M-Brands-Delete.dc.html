<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>手機刪除品牌</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=LXGW+Marker+Gothic&amp;family=Chiron+GoRound+TC:wght@400;500;700&amp;family=Nunito:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF4E8}
*{font-synthesis-weight:none}
*{box-sizing:border-box}
.hd{font-family:'LXGW Marker Gothic','Chiron GoRound TC',sans-serif;font-weight:400}
.num{font-family:Nunito,'Chiron GoRound TC',sans-serif;font-variant-numeric:tabular-nums}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.rd{display:flex;align-items:center;gap:12px;min-height:54px;padding:0 14px;border-radius:12px;border:1.5px solid #E2D2B8;background:#FFFCF6;font-size:15px}
.rd input{width:20px;height:20px;accent-color:#3B2F25;margin:0}
:focus-visible{outline:2.5px solid #3E6270;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:844px;background:#FBF4E8;color:#3B2F25;font-family:'Chiron GoRound TC',sans-serif;position:relative;overflow:hidden">
  <div aria-hidden="true" style="position:absolute;inset:0;background:rgba(59,47,37,.42)"></div>

  <section role="alertdialog" aria-modal="true" aria-labelledby="d-t" aria-describedby="d-d" style="position:absolute;left:0;right:0;bottom:0;background:#FFFCF6;border-radius:20px 20px 0 0;box-shadow:0 -14px 30px rgba(59,47,37,.16);padding:8px 16px 28px;display:flex;flex-direction:column;gap:14px">
    <span aria-hidden="true" style="align-self:center;width:40px;height:4px;border-radius:2px;background:#D9C7AC"></span>
    <h2 id="d-t" class="hd" style="margin:4px 0 0;font-size:22px">刪除「ZARA」？</h2>
    <p id="d-d" style="margin:0;font-size:14px;line-height:1.7;color:#5A4A3C">還有 <b class="num" style="color:#3B2F25">9</b> 件衣物用這個品牌。要怎麼處理它們？</p>
    <fieldset style="border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px">
      <legend style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">衣物的品牌要怎麼處理</legend>
      <label class="rd" style="border:2px solid #3B2F25;background:#FFF9EE"><input type="radio" name="d" checked>品牌欄位清空</label>
      <label class="rd"><input type="radio" name="d">改成另一個品牌…<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="margin-left:auto;width:18px;height:18px;color:#74624F"><path d="M9 6l6 6-6 6"></path></svg></label>
    </fieldset>
    <span style="font-size:12px;color:#74624F">沒有衣物在用的品牌會直接刪除，不跳這個確認。</span>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <a href="B-M-Brands.dc.html" style="display:flex;align-items:center;justify-content:center;height:52px;border-radius:12px;border:1.5px solid #D9C7AC;background:#FFFCF6;color:#3B2F25;font:500 15px 'Chiron GoRound TC';text-decoration:none">取消</a>
      <button type="button" style="height:52px;border:0;border-radius:12px;background:#8E4A3E;color:#FFFCF6;font:500 15px 'Chiron GoRound TC'">刪除</button>
    </div>
  </section>

  <!-- 刪除後的復原提示（示意，位置在畫面上方） -->
  <div role="status" style="position:absolute;left:16px;right:16px;top:24px;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:#3B2F25;color:#FBF4E8;font-size:13px;box-shadow:0 12px 24px -10px rgba(59,47,37,.5)">
    <span style="flex:1">已刪除「Beams」</span>
    <span class="num" style="font-size:11px;color:#D9C7AC">10 秒</span>
    <button type="button" style="height:36px;padding:0 12px;border:0;border-radius:8px;background:#F2CF8E;color:#3B2F25;font:500 13px 'Chiron GoRound TC'">復原</button>
  </div>
  <span style="position:absolute;left:16px;top:84px;font-size:11px;color:#FBF4E8;opacity:.85">↑ 刪除沒在用的品牌後出現的提示（示意）</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
