<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>手機合併品牌</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=LXGW+Marker+Gothic&amp;family=Chiron+GoRound+TC:wght@400;500;700&amp;family=Nunito:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF4E8}
*{font-synthesis-weight:none}
*{box-sizing:border-box}
.hd{font-family:'LXGW Marker Gothic','Chiron GoRound TC',sans-serif;font-weight:400}
.num{font-family:Nunito,'Chiron GoRound TC',sans-serif;font-variant-numeric:tabular-nums}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.rd{display:flex;align-items:center;gap:12px;min-height:54px;padding:0 14px;border-radius:12px;border:1.5px solid #E2D2B8;background:#FFFCF6;font-size:15px}
.rd input{width:20px;height:20px;accent-color:#3B2F25;margin:0}
.chip{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:999px;font-size:13px;background:#F3E7D4}
:focus-visible{outline:2.5px solid #3E6270;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:844px;background:#FBF4E8;color:#3B2F25;font-family:'Chiron GoRound TC',sans-serif;position:relative;overflow:hidden">
  <div aria-hidden="true" style="position:absolute;inset:0;background:rgba(59,47,37,.42)"></div>
  <section role="dialog" aria-modal="true" aria-labelledby="m-t" style="position:absolute;left:0;right:0;bottom:0;top:96px;background:#FFFCF6;border-radius:20px 20px 0 0;box-shadow:0 -14px 30px rgba(59,47,37,.16);padding:8px 16px 28px;display:flex;flex-direction:column;gap:14px">
    <span aria-hidden="true" style="align-self:center;width:40px;height:4px;border-radius:2px;background:#D9C7AC"></span>
    <div style="display:flex;align-items:center"><h2 id="m-t" class="hd" style="margin:0;font-size:22px">合併品牌</h2><button type="button" aria-label="關閉" style="margin-left:auto;width:44px;height:44px;border:0;background:none;color:#3B2F25;display:flex;align-items:center;justify-content:center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <span style="font-size:12px;color:#5A4A3C">要合併的</span>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><span class="chip">COS <span class="num" style="color:#74624F">12</span></span><span class="chip">cos <span class="num" style="color:#74624F">1</span></span><span class="chip">COSS <span class="num" style="color:#74624F">1</span></span><button type="button" class="chip" style="border:1.5px dashed #D9C7AC;background:#FFFCF6;color:#3E6270;font-family:inherit">＋ 再加一個</button></div>
    </div>
    <fieldset style="border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px">
      <legend style="font-size:13px;font-weight:500;padding:0;margin-bottom:8px">保留哪一個名稱？</legend>
      <label class="rd" style="border:2px solid #3B2F25;background:#FFF9EE"><input type="radio" name="k" checked>COS<span class="num" style="margin-left:auto;font-size:12px;color:#5A4A3C">12 件</span></label>
      <label class="rd"><input type="radio" name="k">cos<span class="num" style="margin-left:auto;font-size:12px;color:#5A4A3C">1 件</span></label>
      <label class="rd"><input type="radio" name="k">COSS<span class="num" style="margin-left:auto;font-size:12px;color:#5A4A3C">1 件</span></label>
      <label class="rd" style="border-style:dashed;color:#5A4A3C"><input type="radio" name="k">取一個新名稱…</label>
    </fieldset>
    <div style="padding:12px 14px;border-radius:12px;background:#E6EEE2;color:#2E3F2B;font-size:13px;line-height:1.7"><b class="num">14</b> 件衣物的品牌會改成 <b>COS</b>；「cos」「COSS」會從清單移除。</div>
    <div style="margin-top:auto;display:grid;grid-template-columns:1fr 1.6fr;gap:8px">
      <a href="B-M-Brands.dc.html" style="display:flex;align-items:center;justify-content:center;height:52px;border-radius:12px;border:1.5px solid #D9C7AC;background:#FFFCF6;color:#3B2F25;font:500 15px 'Chiron GoRound TC';text-decoration:none">取消</a>
      <button type="button" style="height:52px;border:0;border-radius:12px;background:#3B2F25;color:#FBF4E8;font:500 15px 'Chiron GoRound TC'">合併成 COS</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
