<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>手機特徵標籤</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=LXGW+Marker+Gothic&amp;family=Chiron+GoRound+TC:wght@400;500;700&amp;family=Nunito:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF4E8}
*{font-synthesis-weight:none}
*{box-sizing:border-box}
.hd{font-family:'LXGW Marker Gothic','Chiron GoRound TC',sans-serif;font-weight:400}
.logo{font-family:Fredoka,'Chiron GoRound TC',sans-serif}
.num{font-family:Nunito,'Chiron GoRound TC',sans-serif;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:10px;font:500 14px 'Chiron GoRound TC',sans-serif;border:1.5px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-p{background:#3B2F25;color:#FBF4E8}
.btn-o{background:#F2CF8E;color:#3B2F25;border-color:#E2B866}
.btn-s{background:#FFFCF6;border-color:#D9C7AC;color:#3B2F25}
.btn-g{background:transparent;color:#5A4A3C}
.ibtn{width:44px;height:44px;border:0;border-radius:10px;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.paper{background:#FFFCF6;border-radius:14px;box-shadow:0 1px 0 rgba(59,47,37,.05),0 12px 24px -14px rgba(59,47,37,.22)}
.lbl{display:inline-flex;align-items:center;height:32px;padding:0 12px;font:400 17px 'LXGW Marker Gothic','Chiron GoRound TC';color:#3B2F25;border-radius:3px;box-shadow:0 2px 4px rgba(59,47,37,.10)}
.tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;flex:none}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav-a{display:inline-flex;align-items:center;height:50px;padding:0 12px;border-bottom:4px solid transparent;font:500 15px 'Chiron GoRound TC';color:#5A4A3C;text-decoration:none}
dl{margin:0}
dl div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1.5px dashed #EADCC6;font-size:13px}
dt{color:#5A4A3C;flex:none}
dd{margin:0;font-weight:500;text-align:right}
.trow{display:grid;grid-template-columns:64px 52px 88px 64px minmax(160px,1fr) 70px;align-items:center;gap:10px;min-height:52px;border-top:1.5px dashed #EADCC6;font-size:14px}
.sticky{position:relative;padding:28px 22px 26px 24px;border-radius:3px;box-shadow:0 1px 0 rgba(59,47,37,.05),0 14px 22px -14px rgba(36,66,77,.4)}
.fold{position:absolute;right:0;bottom:0;width:26px;height:26px;border-radius:0 0 0 4px}
.tape{position:absolute;left:50%;top:-11px;width:96px;height:24px;margin-left:-48px;background:rgba(240,196,118,.62);transform:rotate(-3deg);box-shadow:0 1px 2px rgba(59,47,37,.08)}
.edit{position:absolute;right:8px;top:8px;width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#24424D;display:flex;align-items:center;justify-content:center;cursor:pointer}
ul.bn{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ul.bn li{position:relative;padding-left:18px;font-size:14px;line-height:1.85;color:#24323A}
ul.bn li::before{content:"";position:absolute;left:3px;top:10px;width:6px;height:6px;border-radius:50%;background:var(--dot,#3E6270)}
ul.bn b{font-weight:700}
.sw{position:relative;display:inline-block;width:42px;height:24px;border-radius:999px;flex:none}
.sw span{position:absolute;top:2px;width:20px;height:20px;border-radius:50%;background:#FFFCF6;box-shadow:0 1px 2px rgba(59,47,37,.25)}
.chip{display:inline-flex;align-items:center;gap:4px;height:38px;padding:0 14px;border-radius:999px;border:1.5px solid #E2D2B8;background:#FFFCF6;font:500 13px 'Chiron GoRound TC';color:#3B2F25;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:#3B2F25;border-color:#3B2F25;color:#FBF4E8}
:focus-visible{outline:2.5px solid #3E6270;outline-offset:2px}
a{color:#3E6270}
.ft{display:inline-flex;align-items:center;gap:4px;height:38px;padding:0 13px;border-radius:999px;border:1.5px solid #E2D2B8;background:#FFFCF6;font:500 13px 'Chiron GoRound TC';color:#3B2F25;white-space:nowrap;flex:none}
.ft[data-s="sug"]{border:1.5px dashed #3E6270;background:#EEF4F6;color:#24424D}
.ft[data-s="on"]{background:#3B2F25;border-color:#3B2F25;color:#FBF4E8}
.ft[data-s="add"]{border-style:dashed;border-color:#C9B79C;background:transparent;color:#5A4A3C}
.ft .sp{font-size:10px;padding:1px 5px;border-radius:999px;background:#DCE8EC;color:#24424D}
.row{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.fl{font-size:12px;color:#74624F}
</style>
</helmet>
<div style="width:390px;height:844px;background:#FBF4E8;color:#3B2F25;font-family:'Chiron GoRound TC',sans-serif;position:relative;overflow:hidden">
  <header style="display:flex;align-items:center;gap:4px;padding:6px 4px;border-bottom:1.5px dashed #D9C7AC">
    <button type="button" class="ibtn" aria-label="關閉" style="color:#3B2F25"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    <h1 class="hd" style="margin:0;font-size:20px">加入選購清單</h1>
    <button type="button" class="btn btn-p" style="margin-left:auto;margin-right:8px;height:40px;padding:0 16px">儲存</button>
  </header>
  <main style="padding:14px 16px 40px;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500">名稱
      <span style="display:block;padding:10px 12px;border-radius:12px;border:1.5px solid #E2D2B8;background:#FFFCF6;font-weight:400;font-size:14px;line-height:1.6">#802559 <u style="text-decoration:underline dashed #3E6270 2px;text-underline-offset:4px">後鬆緊</u><u style="text-decoration:underline dashed #3E6270 2px;text-underline-offset:4px">高腰</u><u style="text-decoration:underline dashed #3E6270 2px;text-underline-offset:4px">厚磅</u>親膚毛呢內<u style="text-decoration:underline dashed #3E6270 2px;text-underline-offset:4px">磨毛</u>超顯瘦<u style="text-decoration:underline dashed #3E6270 2px;text-underline-offset:4px">寬褲</u></span>
    </div>
    <div style="display:flex;gap:6px;align-items:center;font-size:12px;color:#5A4A3C"><span class="tag" style="background:#E6EEE2;color:#3F5A3B">下身</span><span class="tag" style="background:#E6EEE2;color:#3F5A3B">褲子</span><span class="tag" style="background:#E6EEE2;color:#3F5A3B">長</span>部位・類型・長度</div>

    <section aria-labelledby="mf" style="display:flex;flex-direction:column;gap:10px;padding:14px 16px;margin:0 -4px;border-radius:14px;background:#FFFCF6;box-shadow:inset 0 0 0 1.5px #EADCC6">
      <div style="display:flex;align-items:center;gap:6px"><h2 id="mf" style="margin:0;font-size:15px">特徵 <span style="font-size:12px;font-weight:400;color:#5A4A3C">選填</span></h2><sc-if value="{{hasSug}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{acceptAll}}" style="margin-left:auto;height:40px;padding:0 4px;border:0;background:none;font:500 13px 'Chiron GoRound TC';color:#3E6270">全部採用（{{sugN}}）</button></sc-if></div>
      <sc-for list="{{singles}}" as="g" hint-placeholder-count="2">
        <div style="display:flex;flex-direction:column;gap:6px"><span class="fl">{{g.t}}</span><div class="row" role="radiogroup" aria-label="{{g.t}}"><sc-for list="{{g.opts}}" as="o" hint-placeholder-count="4"><button type="button" role="radio" aria-checked="{{o.ac}}" class="ft" data-s="{{o.s}}" onClick="{{o.tap}}"><span>{{o.t}}</span><sc-if value="{{o.isSug}}" hint-placeholder-val="{{ false }}"><span class="sp">名稱</span></sc-if></button></sc-for></div></div>
      </sc-for>
      <div style="display:flex;flex-direction:column;gap:6px"><span class="fl">特徵</span>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <sc-for list="{{multi}}" as="o" hint-placeholder-count="5"><button type="button" aria-pressed="{{o.ac}}" class="ft" data-s="{{o.s}}" onClick="{{o.tap}}"><span>{{o.t}}</span><sc-if value="{{o.isSug}}" hint-placeholder-val="{{ false }}"><span class="sp">名稱</span></sc-if></button></sc-for>
          <button type="button" class="ft" data-s="add" onClick="{{open}}">＋ 更多・新增</button>
        </div>
      </div>
      <span style="font-size:11.5px;line-height:1.6;color:#5A4A3C">手機只先露 5 個（從名稱找到的排前面），其他和「新增」都在下方面板。</span>
    </section>
    <div style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;opacity:.55">顏色<span style="height:46px;border-radius:12px;border:1.5px solid #E2D2B8;background:#FFFCF6"></span></div>
  </main>

  <sc-if value="{{sheet}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" onClick="{{close}}" style="position:absolute;inset:0;background:rgba(59,47,37,.42)"></div>
    <section role="dialog" aria-modal="true" aria-labelledby="ms" style="position:absolute;left:0;right:0;bottom:0;max-height:78%;background:#FFFCF6;border-radius:22px 22px 0 0;padding:8px 16px 26px;display:flex;flex-direction:column;gap:12px">
      <span aria-hidden="true" style="align-self:center;width:40px;height:4px;border-radius:2px;background:#D9C7AC"></span>
      <div style="display:flex;align-items:center"><h2 id="ms" class="hd" style="margin:0;font-size:20px">特徵</h2><button type="button" onClick="{{close}}" class="btn btn-p" style="margin-left:auto;height:40px;padding:0 16px">完成</button></div>
      <label style="display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:12px;border:2px solid #3E6270;background:#FBF4E8"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px;color:#74624F"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg><span style="position:absolute;width:1px;height:1px;overflow:hidden">搜尋或新增特徵</span><input value="闊腿" style="flex:1;min-width:0;border:0;background:transparent;font:400 14px 'Chiron GoRound TC';color:#3B2F25;outline:none"></label>
      <div style="display:flex;flex-direction:column;border-radius:12px;background:#FBF4E8">
        <button type="button" style="display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:52px;padding:8px 12px;border:0;background:none;text-align:left;font:400 14px 'Chiron GoRound TC';color:#3B2F25"><span><b>寬褲</b><span style="font-size:12px;color:#5A4A3C">・褲型</span></span><span style="font-size:12px;color:#5A4A3C">「闊腿」是它的別名，選這個</span></button>
        <button type="button" style="display:flex;align-items:center;min-height:48px;padding:0 12px;border:0;border-top:1.5px dashed #EADCC6;background:none;font:500 14px 'Chiron GoRound TC';color:#3E6270;text-align:left">＋ 新增「闊腿」</button>
      </div>
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <div style="display:flex;flex-direction:column;gap:6px"><span class="fl">{{g.t}}</span><div style="display:flex;gap:6px;flex-wrap:wrap"><sc-for list="{{g.opts}}" as="o" hint-placeholder-count="4"><span class="ft" data-s="{{o.s}}">{{o.t}}</span></sc-for></div></div>
      </sc-for>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pick: { '厚磅': true }, sheet: false }; }
  renderVals() {
    const st = this.state, pick = st.pick;
    const SUG = ['高腰', '寬褲', '後鬆緊', '厚磅', '磨毛'];
    const set = (k, v) => this.setState({ pick: Object.assign({}, pick, { [k]: v }) });
    const S = [['腰高', ['高腰', '中腰', '低腰']], ['褲型', ['寬褲', '直筒', '錐形', '喇叭', '燈籠']]];
    const singles = S.map(([t, opts]) => ({ t, opts: opts.map(o => {
      const on = pick[t] === o, sug = SUG.includes(o) && pick[t] === undefined;
      return { t: o, s: on ? 'on' : (sug ? 'sug' : 'off'), isSug: sug, ac: on ? 'true' : 'false', tap: () => set(t, on ? null : o) };
    }) }));
    const M = ['後鬆緊', '厚磅', '磨毛', '打褶', '垂墜'];
    const multi = M.map(o => {
      const on = pick[o] === true, sug = SUG.includes(o) && pick[o] === undefined;
      return { t: o, s: on ? 'on' : (sug ? 'sug' : 'off'), isSug: sug, ac: on ? 'true' : 'false', tap: () => set(o, !on) };
    });
    const sugLeft = SUG.filter(o => (o === '高腰' ? pick['腰高'] : o === '寬褲' ? pick['褲型'] : pick[o]) === undefined);
    const G = [['質感', ['厚磅', '磨毛', '挺版', '垂墜', '針織感']], ['細節', ['後鬆緊', '打褶', '開衩', '有口袋', '綁帶']], ['場合', ['上班', '休閒', '運動']]];
    return {
      singles, multi, hasSug: sugLeft.length > 0, sugN: sugLeft.length,
      acceptAll: () => { const p = Object.assign({}, pick); if (p['腰高'] === undefined) p['腰高'] = '高腰'; if (p['褲型'] === undefined) p['褲型'] = '寬褲'; ['後鬆緊', '厚磅', '磨毛'].forEach(o => { if (p[o] === undefined) p[o] = true; }); this.setState({ pick: p }); },
      sheet: st.sheet, open: () => this.setState({ sheet: true }), close: () => this.setState({ sheet: false }),
      groups: G.map(([t, opts]) => ({ t, opts: opts.map(o => ({ t: o, s: pick[o] === true ? 'on' : (SUG.includes(o) && pick[o] === undefined ? 'sug' : 'off') })) }))
    };
  }
}
</script>
</body>
</html>
