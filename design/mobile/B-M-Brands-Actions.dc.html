    </div>

    <a class="act" href="B-Closet.dc.html" style="border-top:0"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path></svg>看這個品牌的衣物<small class="num">12 件</small></a>
