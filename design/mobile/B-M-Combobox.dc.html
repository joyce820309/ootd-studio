<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>手機品牌選擇</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=LXGW+Marker+Gothic&amp;family=Chiron+GoRound+TC:wght@400;500;700&amp;family=Nunito:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF4E8}
*{font-synthesis-weight:none}
*{box-sizing:border-box}
.hd{font-family:'LXGW Marker Gothic','Chiron GoRound TC',sans-serif;font-weight:400}
.num{font-family:Nunito,'Chiron GoRound TC',sans-serif;font-variant-numeric:tabular-nums}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.opt{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 12px;border-bottom:1.5px dashed #EADCC6;font-size:15px;color:#3B2F25;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font-family:inherit}
.cnt{margin-left:auto;font:600 12px Nunito,'Chiron GoRound TC';color:#74624F}
.grp{padding:12px 12px 4px;font-size:11px;color:#74624F}
:focus-visible{outline:2.5px solid #3E6270;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:844px;background:#FBF4E8;color:#3B2F25;font-family:'Chiron GoRound TC',sans-serif;position:relative;overflow:hidden">
  <div aria-hidden="true" style="position:absolute;inset:0;padding:70px 16px;display:flex;flex-direction:column;gap:12px">
    <div style="height:22px;width:120px;border-radius:6px;background:#EADCC6"></div><div style="height:50px;border-radius:12px;background:#FFFCF6"></div><div style="height:50px;border-radius:12px;background:#FFFCF6"></div>
  </div>
  <div aria-hidden="true" style="position:absolute;inset:0;background:rgba(59,47,37,.42)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="t" style="position:absolute;left:0;right:0;bottom:0;top:44px;background:#FFFCF6;border-radius:20px 20px 0 0;box-shadow:0 -14px 30px rgba(59,47,37,.16);display:flex;flex-direction:column">
    <span aria-hidden="true" style="align-self:center;margin-top:8px;width:40px;height:4px;border-radius:2px;background:#D9C7AC"></span>
    <header style="display:flex;align-items:center;gap:8px;padding:6px 8px 8px 16px">
      <h2 id="t" class="hd" style="margin:0;font-size:21px">品牌</h2>
      <button type="button" style="margin-left:auto;min-width:56px;height:44px;border:0;background:none;color:#3E6270;font:500 15px 'Chiron GoRound TC'">取消</button>
    </header>
    <div style="padding:0 16px 8px">
      <div style="display:flex;align-items:center;gap:8px;height:48px;padding:0 6px 0 12px;border-radius:12px;border:1.5px solid #3E6270;background:#FFFCF6">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px;color:#5A4A3C"><path d="M11 18a7 7 0 1 1 0-14 7 7 0 0 1 0 14zM16 16l4 4"></path></svg>
        <input role="combobox" aria-expanded="true" aria-controls="lb" aria-label="搜尋或輸入品牌" value="COSS" style="flex:1;min-width:0;border:0;background:transparent;font:400 16px 'Chiron GoRound TC';color:#3B2F25">
        <button type="button" aria-label="清除輸入" style="width:36px;height:36px;border:0;border-radius:8px;background:#F3E7D4;color:#5A4A3C;display:flex;align-items:center;justify-content:center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
    </div>
    <div style="margin:0 16px 4px;display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;background:#DCE8EC;color:#24424D;font-size:13px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zM12 11v5M12 8h.01"></path></svg>你是不是要找已經有的品牌？</div>
    <div id="lb" role="listbox" aria-label="品牌" style="padding:0 4px">
      <button class="opt" role="option" aria-selected="false" type="button" style="background:#F6E7C6;border-radius:10px;border-bottom-color:transparent">COS<span style="font-size:11px;padding:1px 8px;border-radius:999px;background:#E6EEE2;color:#2E3F2B">很像</span><span class="cnt">12 件</span></button>
      <button class="opt" role="option" aria-selected="false" type="button">COS STORES<span class="cnt">2 件</span></button>
      <button class="opt" role="option" aria-selected="false" type="button" style="color:#5A4A3C;border-bottom:0"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M12 5v14M5 12h14"></path></svg>還是要建立「COSS」</button>
    </div>
    <div style="margin-top:auto;padding:12px 16px 28px;border-top:1.5px dashed #D9C7AC;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#74624F">
      <span>沒輸入時顯示：最常用 3 個＋全部 A–Z</span>
      <a href="B-M-Brands.dc.html" style="min-height:44px;display:flex;align-items:center;color:#3E6270;font-weight:500;font-size:13px">管理品牌</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
