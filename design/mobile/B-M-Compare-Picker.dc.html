<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>手機比較・加入商品</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=LXGW+Marker+Gothic&amp;family=Chiron+GoRound+TC:wght@400;500;700&amp;family=Nunito:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF4E8}
*{font-synthesis-weight:none}
*{box-sizing:border-box}
.hd{font-family:'LXGW Marker Gothic','Chiron GoRound TC',sans-serif;font-weight:400}
.logo{font-family:Fredoka,'Chiron GoRound TC',sans-serif}
.num{font-family:Nunito,'Chiron GoRound TC',sans-serif;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:10px;font:500 14px 'Chiron GoRound TC',sans-serif;border:1.5px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-p{background:#3B2F25;color:#FBF4E8}
.btn-o{background:#F2CF8E;color:#3B2F25;border-color:#E2B866}
.btn-s{background:#FFFCF6;border-color:#D9C7AC;color:#3B2F25}
.btn-g{background:transparent;color:#5A4A3C}
.ibtn{width:44px;height:44px;border:0;border-radius:10px;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.paper{background:#FFFCF6;border-radius:14px;box-shadow:0 1px 0 rgba(59,47,37,.05),0 12px 24px -14px rgba(59,47,37,.22)}
.lbl{display:inline-flex;align-items:center;height:32px;padding:0 12px;font:400 17px 'LXGW Marker Gothic','Chiron GoRound TC';color:#3B2F25;border-radius:3px;box-shadow:0 2px 4px rgba(59,47,37,.10)}
.tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;flex:none}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav-a{display:inline-flex;align-items:center;height:50px;padding:0 12px;border-bottom:4px solid transparent;font:500 15px 'Chiron GoRound TC';color:#5A4A3C;text-decoration:none}
dl{margin:0}
dl div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1.5px dashed #EADCC6;font-size:13px}
dt{color:#5A4A3C;flex:none}
dd{margin:0;font-weight:500;text-align:right}
.trow{display:grid;grid-template-columns:64px 52px 88px 64px minmax(160px,1fr) 70px;align-items:center;gap:10px;min-height:52px;border-top:1.5px dashed #EADCC6;font-size:14px}
.sticky{position:relative;padding:28px 22px 26px 24px;border-radius:3px;box-shadow:0 1px 0 rgba(59,47,37,.05),0 14px 22px -14px rgba(36,66,77,.4)}
.fold{position:absolute;right:0;bottom:0;width:26px;height:26px;border-radius:0 0 0 4px}
.tape{position:absolute;left:50%;top:-11px;width:96px;height:24px;margin-left:-48px;background:rgba(240,196,118,.62);transform:rotate(-3deg);box-shadow:0 1px 2px rgba(59,47,37,.08)}
.edit{position:absolute;right:8px;top:8px;width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#24424D;display:flex;align-items:center;justify-content:center;cursor:pointer}
ul.bn{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ul.bn li{position:relative;padding-left:18px;font-size:14px;line-height:1.85;color:#24323A}
ul.bn li::before{content:"";position:absolute;left:3px;top:10px;width:6px;height:6px;border-radius:50%;background:var(--dot,#3E6270)}
ul.bn b{font-weight:700}
.sw{position:relative;display:inline-block;width:42px;height:24px;border-radius:999px;flex:none}
.sw span{position:absolute;top:2px;width:20px;height:20px;border-radius:50%;background:#FFFCF6;box-shadow:0 1px 2px rgba(59,47,37,.25)}
.chip{display:inline-flex;align-items:center;gap:4px;height:38px;padding:0 14px;border-radius:999px;border:1.5px solid #E2D2B8;background:#FFFCF6;font:500 13px 'Chiron GoRound TC';color:#3B2F25;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:#3B2F25;border-color:#3B2F25;color:#FBF4E8}
:focus-visible{outline:2.5px solid #3E6270;outline-offset:2px}
a{color:#3E6270}
.cb{position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none}
.cb .bx{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.cb .bx svg{width:16px;height:16px;fill:none;stroke:#FBF4E8;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.fc{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 12px;border-radius:999px;border:1.5px solid #E2D2B8;background:#FFFCF6;font:500 13px 'Chiron GoRound TC';color:#3B2F25;white-space:nowrap;flex:none}
.fc[aria-pressed="true"]{background:#3B2F25;border-color:#3B2F25;color:#FBF4E8}
.sub{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 10px;border-radius:999px;border:1.5px dashed #D9C7AC;background:transparent;font:500 12px 'Chiron GoRound TC';color:#5A4A3C;white-space:nowrap;flex:none}
.sub[aria-pressed="true"]{border-style:solid;border-color:#3E6270;background:#DCE8EC;color:#24424D}
.row{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.tab{flex:1;height:38px;border:0;border-radius:8px;background:transparent;font:500 13px 'Chiron GoRound TC';color:#5A4A3C}
.tab[aria-selected="true"]{background:#FFFCF6;color:#3B2F25;font-weight:700;box-shadow:0 1px 2px rgba(59,47,37,.1)}
</style>
</helmet>
<div style="width:390px;height:844px;background:#FBF4E8;color:#3B2F25;font-family:'Chiron GoRound TC',sans-serif;position:relative;overflow:hidden">
  <div aria-hidden="true" style="padding:14px 16px;opacity:.5"><span class="hd" style="font-size:21px">寬褲三選一</span></div>
  <div aria-hidden="true" style="position:absolute;inset:0;background:rgba(59,47,37,.42)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="mp" style="position:absolute;left:0;right:0;top:44px;bottom:0;background:#FFFCF6;border-radius:22px 22px 0 0;padding:8px 16px 0;display:flex;flex-direction:column;gap:10px">
    <span aria-hidden="true" style="align-self:center;width:40px;height:4px;border-radius:2px;background:#D9C7AC"></span>
    <div style="display:flex;align-items:center;gap:6px;margin-top:-6px"><h2 id="mp" class="hd" style="margin:0;font-size:20px">加入「寬褲三選一」</h2><button type="button" class="ibtn" aria-label="關閉" style="margin-left:auto;margin-right:-10px;color:#3B2F25"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
    <div role="tablist" aria-label="從哪裡加" style="display:flex;padding:3px;border-radius:10px;background:#F3E7D4"><button type="button" role="tab" class="tab" aria-selected="true">選購清單</button><button type="button" role="tab" class="tab" aria-selected="false">我的衣櫃</button><button type="button" role="tab" class="tab" aria-selected="false">貼網址</button></div>
    <label style="display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:12px;border:1.5px solid #E2D2B8;background:#FBF4E8"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color:#74624F;width:18px;height:18px"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg><span style="position:absolute;width:1px;height:1px;overflow:hidden">搜尋</span><input placeholder="搜尋名稱、店家" style="flex:1;min-width:0;border:0;background:transparent;font:400 14px 'Chiron GoRound TC';color:#3B2F25;outline:none"></label>
    <div class="row" role="group" aria-label="部位"><sc-for list="{{parts}}" as="s" hint-placeholder-count="6"><button type="button" class="fc" aria-pressed="{{s.on}}">{{s.t}}<span class="num" style="font-size:11px;opacity:.7">{{s.n}}</span></button></sc-for></div>
    <div class="row" role="group" aria-label="類型與長度"><sc-for list="{{subs}}" as="s" hint-placeholder-count="7"><button type="button" class="sub" aria-pressed="{{s.on}}">{{s.t}}</button></sc-for></div>

    <div style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:6px;margin:2px -4px 0;padding:0 4px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
        <div role="checkbox" aria-checked="{{it.ac}}" aria-disabled="{{it.dis}}" tabindex="0" onClick="{{it.tog}}" style="display:flex;align-items:center;gap:8px;padding:6px 10px 6px 0;border-radius:12px;background:{{it.bg}};box-shadow:{{it.ring}};opacity:{{it.op}}">
          <span class="cb"><span class="bx" style="background:{{it.bxbg}};box-shadow:{{it.bxsh}};transform:rotate({{it.r}}deg)"><sc-if value="{{it.check}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if></span></span>
          <span style="width:46px;height:54px;border-radius:9px;background:{{it.tb}};flex:none;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 100 100" style="width:66%;height:80%" aria-hidden="true"><path d="M30 8H70L80 92H56L50 36L44 92H20Z" fill="{{it.hex}}" stroke="rgba(59,47,37,.3)" stroke-width="1.5"></path></svg></span>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font-size:13px;font-weight:700;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{it.name}}</span><span style="display:flex;align-items:center;gap:6px;font-size:11px;color:#5A4A3C"><b class="num" style="color:#3B2F25;font-size:12px">{{it.price}}</b><sc-if value="{{it.lock}}" hint-placeholder-val="{{ false }}"><span>已在這個比較</span></sc-if><sc-if value="{{it.also}}" hint-placeholder-val="{{ false }}"><span style="color:#24424D">也在：{{it.also}}</span></sc-if></span></span>
        </div>
      </sc-for>
    </div>

    <div style="display:flex;align-items:center;gap:4px;margin:0 -16px;padding:8px 16px 26px 4px;border-top:1.5px dashed #D9C7AC;background:#FFFCF6">
      <span class="cb"><span class="bx" style="background:{{allBg}};box-shadow:{{allSh}};transform:rotate({{allR}}deg)"><sc-if value="{{allDash}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"></path></svg></sc-if></span></span>
      <span style="font-size:13px;line-height:1.35">全選 <b class="num">3</b> 件<br><span style="font-size:11px;color:#5A4A3C">已選 {{k}}</span></span>
      <button type="button" class="btn btn-p" style="margin-left:auto;height:48px;min-width:140px">{{cta}}</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: [3, 4] }; }
  renderVals() {
    const sel = this.state.sel, OFF = 'inset 0 0 0 1.5px #8C775C';
    const I = [
      ['#802556 超顯瘦撞色收邊後鬆緊質感毛呢褲', 'NT$590', '#2B2724', '#F1E4E2', 1, ''],
      ['寬版九分打褶褲', 'NT$990', '#C9B48F', '#F6E7C6', 1, ''],
      ['奶油白羊毛直筒寬褲', 'NT$2,280', '#F2EADB', '#E6EEE2', 1, ''],
      ['#41108 高腰西裝感直筒長褲', 'NT$690', '#3E5A78', '#DCE8EC', 0, '褲子'],
      ['燈芯絨鬆緊寬褲', 'NT$480', '#8A6A4B', '#F3E7D4', 0, ''],
      ['刷毛內裡直筒休閒褲', 'NT$1,290', '#4A6A8A', '#DCE8EC', 0, '褲子']
    ];
    const items = I.map(([name, price, hex, tb, lock, also], i) => {
      const on = !!lock || sel.includes(i);
      return { name, price, hex, tb, lock: !!lock, also, check: on, ac: on ? 'true' : 'false', dis: lock ? 'true' : 'false', op: lock ? .72 : 1,
        bg: lock ? '#F8EFE1' : (on ? '#FFF9EE' : '#FFFCF6'), ring: !lock && on ? 'inset 0 0 0 2px #3B2F25' : 'inset 0 0 0 1.5px #EADCC6',
        bxbg: lock ? '#B9A88E' : (on ? '#3B2F25' : '#FFFCF6'), bxsh: on ? 'none' : OFF, r: on ? -4 : 0,
        tog: () => { if (lock) return; this.setState({ sel: sel.includes(i) ? sel.filter(x => x !== i) : sel.concat(i) }); } };
    });
    const k = sel.length;
    return {
      parts: [['全部', 12], ['下身', 6, 1], ['上衣', 7], ['外套', 2], ['鞋子', 1], ['包包', 0]].map(([t, n, on]) => ({ t, n, on: on ? 'true' : 'false' })),
      subs: [['褲子', 1], ['牛仔褲'], ['裙子'], ['內搭褲'], ['長度：長', 1], ['長度：中'], ['長度：短'], ['考慮中', 1]].map(([t, on]) => ({ t, on: on ? 'true' : 'false' })),
      items, k,
      allBg: k ? '#3B2F25' : '#FFFCF6', allSh: k ? 'none' : OFF, allR: k ? -4 : 0, allDash: k > 0,
      cta: k ? `加入 ${k} 件` : '先勾選商品'
    };
  }
}
</script>
</body>
</html>
