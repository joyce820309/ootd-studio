<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>手機登入</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=LXGW+Marker+Gothic&amp;family=Chiron+GoRound+TC:wght@400;500;700&amp;family=Nunito:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF4E8}
*{font-synthesis-weight:none}
*{box-sizing:border-box}
.hd{font-family:'LXGW Marker Gothic','Chiron GoRound TC',serif}
.logo{font-family:Fredoka,'Chiron GoRound TC',sans-serif}
.inp{height:50px;border:1.5px solid #D9C7AC;border-radius:12px;background:#FFFCF6;padding:0 14px;font:400 15px 'Chiron GoRound TC',sans-serif;color:#3B2F25;width:100%}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2.5px solid #3E6270;outline-offset:2px}
a{color:#3E6270}
</style>
</helmet>
<div style="width:390px;height:844px;background:#FBF4E8;color:#3B2F25;font-family:'Chiron GoRound TC',sans-serif;position:relative;overflow:hidden;display:flex;flex-direction:column">
  <div aria-hidden="true" style="position:relative;height:200px;background:#F6E9D3;overflow:hidden;flex:none">
    <span style="position:absolute;left:8%;top:18%;width:42%;height:56%;border-radius:22px;background:rgba(240,196,118,.55);mix-blend-mode:multiply;transform:rotate(-6deg)"></span>
    <span style="position:absolute;left:38%;top:8%;width:42%;height:50%;border-radius:22px;background:rgba(150,186,198,.5);mix-blend-mode:multiply;transform:rotate(5deg)"></span>
    <span style="position:absolute;left:52%;top:44%;width:40%;height:44%;border-radius:22px;background:rgba(222,166,152,.45);mix-blend-mode:multiply;transform:rotate(-3deg)"></span>
    <svg viewBox="0 0 100 100" style="position:absolute;left:18%;top:16%;width:28%;transform:rotate(-6deg);filter:drop-shadow(0 8px 10px rgba(59,47,37,.2))"><path d="M30 12L44 10L50 30L56 10L70 12L84 28L90 84L80 86L72 46L74 92H26L28 46L20 86L10 84L16 28Z" fill="#B88A5A"></path></svg>
    <svg viewBox="0 0 100 100" style="position:absolute;left:50%;top:12%;width:24%;transform:rotate(4deg);filter:drop-shadow(0 8px 10px rgba(59,47,37,.2))"><path d="M32 16L44 13Q50 19 56 13L68 16L80 30L88 78L78 80L70 42V86H30V42L22 80L12 78L20 30Z" fill="#F4F1EA" stroke="rgba(59,47,37,.2)"></path></svg>
    <span class="logo" style="position:absolute;left:16px;bottom:16px;font-size:20px;font-weight:600;display:inline-block;padding:3px 10px;background:#F2CF8E;border-radius:3px;transform:rotate(-2deg);box-shadow:0 2px 4px rgba(59,47,37,.14)">My Closet</span>
  </div>

  <main style="flex:1;padding:24px 20px;display:flex;flex-direction:column;gap:16px">
    <h1 class="hd" style="margin:0;font-size:28px;font-weight:700">登入你的衣櫃</h1>

    <button type="button" style="display:flex;align-items:center;justify-content:center;gap:10px;height:50px;border-radius:12px;border:1.5px solid #D9C7AC;background:#FFFCF6;font:500 15px 'Chiron GoRound TC';color:#3B2F25">
      <svg viewBox="0 0 24 24" style="width:20px;height:20px" aria-hidden="true"><path d="M21.6 12.2c0-.7-.1-1.3-.2-1.9H12v3.6h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.2z" fill="#4285F4"></path><path d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z" fill="#34A853"></path><path d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1A10 10 0 0 0 2 12c0 1.6.4 3.1 1.1 4.6z" fill="#FBBC05"></path><path d="M12 6c1.5 0 2.8.5 3.8 1.5l2.8-2.8A10 10 0 0 0 3.1 7.4L6.4 10C7.2 7.7 9.4 6 12 6z" fill="#EA4335"></path></svg>
      使用 Google 帳號登入
    </button>
    <div style="display:flex;align-items:center;gap:12px;font-size:12px;color:#5A4A3C"><span style="flex:1;border-top:1.5px dashed #D9C7AC"></span>或用 Email<span style="flex:1;border-top:1.5px dashed #D9C7AC"></span></div>

    <div role="alert" id="err" style="display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:#F4DDD6;border:1.5px solid #E6C5BB;color:#5E2E25;font-size:13px;line-height:1.6">
      <svg class="ic" viewBox="0 0 24 24" style="width:18px;height:18px;margin-top:1px" aria-hidden="true"><path d="M12 4l9 16H3zM12 10v4M12 17h.01"></path></svg>
      <span>Email 或密碼不太對，再試一次，或改用登入連結。</span>
    </div>

    <form style="display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;flex-direction:column;gap:6px"><label for="mem" style="font-size:13px;font-weight:500">Email</label><input id="mem" class="inp" type="email" value="joyce@example.com" aria-describedby="err"></div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;justify-content:space-between"><label for="mpw" style="font-size:13px;font-weight:500">密碼</label><a href="#forgot" style="font-size:13px">忘記密碼？</a></div>
        <input id="mpw" class="inp" type="password" value="••••••" aria-invalid="true" aria-describedby="err" style="border-color:#8E4A3E">
      </div>
    </form>
  </main>

  <footer style="padding:12px 20px 28px;display:flex;flex-direction:column;gap:10px;align-items:center;border-top:1.5px dashed #D9C7AC">
    <a href="B-M-Home.dc.html" style="width:100%;height:52px;border-radius:12px;background:#3B2F25;color:#FBF4E8;font:500 15px 'Chiron GoRound TC';text-decoration:none;display:flex;align-items:center;justify-content:center">登入</a>
    <button type="button" style="height:36px;border:0;background:none;color:#3E6270;font:400 14px 'Chiron GoRound TC';text-decoration:underline">改用登入連結（免密碼）</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

</body>
</html>
