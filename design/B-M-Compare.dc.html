<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>手機比較試搭</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=LXGW+Marker+Gothic&amp;family=Chiron+GoRound+TC:wght@400;500;700&amp;family=Nunito:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF4E8}
*{font-synthesis-weight:none}
*{box-sizing:border-box}
.hd{font-family:'LXGW Marker Gothic','Chiron GoRound TC',serif}
.num{font-family:Nunito,'Chiron GoRound TC',sans-serif;font-variant-numeric:tabular-nums}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.r{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-top:1.5px dashed #EADCC6}
.r span:first-child{color:#5A4A3C}
.best{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:999px;background:#DCE7D8;color:#3F5A3B;font-size:10px;margin-left:4px}
.cell{position:relative;border-radius:10px;background:#FBF4E8;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0}
:focus-visible{outline:2.5px solid #3E6270;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:844px;background:#FBF4E8;color:#3B2F25;font-family:'Chiron GoRound TC',sans-serif;position:relative;overflow:hidden;display:flex;flex-direction:column">
  <header style="display:flex;align-items:center;gap:4px;padding:8px 8px 8px 4px;background:#FBF4E8;border-bottom:1.5px dashed #D9C7AC">
    <a href="B-Wishlist.dc.html" aria-label="返回選購清單" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#3B2F25"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <div style="display:flex;flex-direction:column"><span class="hd" style="font-size:18px;font-weight:700">冬天想要一條寬褲</span><span style="font-size:11px;color:#74624F">3 個候選・3 個網站</span></div>
    <button type="button" aria-label="貼上網址加入候選" style="margin-left:auto;width:44px;height:44px;border:0;border-radius:10px;background:#F2CF8E;color:#3B2F25;display:flex;align-items:center;justify-content:center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
  </header>

  <div aria-label="候選商品，可左右滑動" style="display:flex;gap:10px;padding:14px 0 4px 12px;overflow:hidden">
    <sc-for list="{{cands}}" as="c" hint-placeholder-count="3">
      <article style="flex:0 0 200px;padding:10px;border-radius:14px;background:#FFFCF6;border:{{c.bd}};display:flex;flex-direction:column;gap:6px">
        <div style="position:relative;height:110px;border-radius:10px;background:#F4DDD6;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 100 100" style="height:88%;aspect-ratio:1/1" role="img" aria-label="{{c.name}}"><path d="M32 10H68L72 90H56L50 36L44 90H28Z" fill="{{c.hex}}" stroke="rgba(59,47,37,.22)" stroke-width="0.7"></path></svg><span style="position:absolute;left:6px;top:6px;height:20px;padding:0 7px;border-radius:999px;background:#FFFCF6;font-size:10px;display:flex;align-items:center">{{c.shop}}</span></div>
        <span style="font-size:12px;font-weight:500;line-height:1.35">{{c.name}}</span>
        <span class="num" style="font-size:17px;font-weight:700">{{c.total}}<sc-if value="{{c.cheap}}" hint-placeholder-val="{{ false }}"><span class="best">最省</span></sc-if></span>
        <div>
          <div class="r"><span>你的尺寸</span><span style="color:{{c.sc}};font-weight:500">{{c.size}}</span></div>
          <div class="r"><span>衣櫃可搭</span><span class="num">{{c.match}} 件<sc-if value="{{c.most}}" hint-placeholder-val="{{ false }}"><span class="best">最多</span></sc-if></span></div>
          <div class="r"><span>退換</span><span>{{c.ret}}</span></div>
        </div>
        <button type="button" aria-pressed="{{c.on}}" style="height:40px;border-radius:10px;border:{{c.bbd}};background:{{c.bbg}};color:{{c.bfg}};font:500 13px 'Chiron GoRound TC'">{{c.bt}}</button>
      </article>
    </sc-for>
  </div>
  <div aria-hidden="true" style="display:flex;justify-content:center;gap:5px;padding:6px 0"><span style="width:14px;height:4px;border-radius:2px;background:#3B2F25"></span><span style="width:4px;height:4px;border-radius:2px;background:#D9C7AC"></span><span style="width:4px;height:4px;border-radius:2px;background:#D9C7AC"></span></div>

  <section aria-label="混搭試穿" style="margin:4px 12px 0;padding:10px;border-radius:14px;background:#FFFCF6;display:flex;gap:10px">
    <div style="flex:0 0 150px;display:grid;gap:4px;height:190px;grid-template-columns:1fr 1.2fr;grid-template-rows:1fr 1.1fr .6fr;grid-template-areas:'outer top' 'outer bottom' '. shoes'">
      <sc-for list="{{board}}" as="b" hint-placeholder-count="4">
        <div class="cell" style="grid-area:{{b.area}};outline:{{b.ol}};outline-offset:-1.5px"><span aria-hidden="true" style="position:absolute;inset:10%;border-radius:8px;background:{{b.wash}};mix-blend-mode:multiply"></span><svg viewBox="0 0 100 100" style="position:relative;height:82%;aspect-ratio:1/1" role="img" aria-label="{{b.name}}"><path d="{{b.d}}" fill="{{b.hex}}" stroke="rgba(59,47,37,.22)" stroke-width="0.8"></path></svg></div>
      </sc-for>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:6px;min-width:0">
      <span class="hd" style="font-size:16px;font-weight:700">混搭試穿</span>
      <span style="font-size:12px;line-height:1.6;color:#5A4A3C">海軍藍外套與寬褲都還沒買，其餘來自衣櫃</span>
      <button type="button" style="align-self:flex-start;height:32px;padding:0 10px;border-radius:999px;border:1.5px dashed #C9A296;background:#FFFCF6;font:500 11px 'Chiron GoRound TC';color:#3B2F25">換外套來源</button>
      <span style="margin-top:auto;font-size:12px;color:#5E2E25">2 件未購買</span>
      <span class="num" style="font-size:18px;font-weight:700;color:#5E2E25">合計 NT$9,890</span>
    </div>
  </section>

  <div style="margin:10px 12px 0;padding:10px 12px;border-radius:12px;background:#E6EEE2;font-size:12px;line-height:1.7;color:#2E3F2B">COS 那條可搭最多、最貼近你的高腰直筒偏好；UNIQLO 最省但偏薄。</div>

  <footer style="position:absolute;left:0;right:0;bottom:0;padding:12px 12px 28px;background:#FBF4E8;border-top:1.5px dashed #D9C7AC;display:grid;grid-template-columns:1fr 1.4fr;gap:8px">
    <button type="button" style="height:50px;border-radius:12px;border:1.5px solid #D9C7AC;background:#FFFCF6;color:#3B2F25;font:500 14px 'Chiron GoRound TC'">存成穿搭</button>
    <button type="button" style="height:50px;border-radius:12px;border:0;background:#3B2F25;color:#FBF4E8;font:500 14px 'Chiron GoRound TC'">決定買 COS 這條</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const c = (shop,name,hex,total,size,sc,match,ret,on,cheap,most) => ({shop,name,hex,total,size,sc,match,ret,on,cheap,most,
      bd: on ? '2px solid #3B2F25' : '1.5px dashed #D9C7AC', bbd: on ? '0' : '1.5px solid #D9C7AC', bbg: on ? '#3B2F25' : '#FFFCF6', bfg: on ? '#FBF4E8' : '#3B2F25', bt: on ? '試穿中' : '放上試穿'});
    const W = { outer:'rgba(150,186,198,.35)', top:'rgba(240,196,118,.4)', bottom:'rgba(167,192,158,.42)', shoes:'rgba(222,166,152,.38)' };
    const b = (area,name,hex,d,wish) => ({area,name,hex,d,wash:W[area],ol: wish ? '1.5px dashed #8E4A3E' : 'none'});
    return {
      cands: [
        c('COS 官網','羊毛混紡高腰寬褲','#EFE8DA','NT$3,900','36 有貨','#3F5A3B',12,'30 天',true,false,true),
        c('UNIQLO 線上','寬版九分打褶褲','#E6DCC8','NT$1,050','M 有貨','#3F5A3B',9,'30 天',false,true,false),
        c('選物店・蝦皮','奶油白羊毛直筒寬褲','#F2EADB','NT$2,340','只剩 L','#8E4A3E',10,'7 天',false,false,false)
      ],
      board: [
        b('outer','海軍藍外套（想買）','#2E3A4F','M30 12L44 10L50 30L56 10L70 12L84 28L90 84L80 86L72 46L74 92H26L28 46L20 86L10 84L16 28Z',true),
        b('top','燕麥針織衫','#D9CBB3','M32 16L44 13Q50 19 56 13L68 16L80 30L88 78L78 80L70 42V86H30V42L22 80L12 78L20 30Z'),
        b('bottom','羊毛寬褲（想買）','#EFE8DA','M32 10H68L72 90H56L50 36L44 90H28Z',true),
        b('shoes','黑色皮革短靴','#2A2826','M30 14H52V56Q70 58 84 66Q90 70 88 80H30Z')
      ]
    };
  }
}
</script>
</body>
</html>
