<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>手機穿搭日記</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=LXGW+Marker+Gothic&amp;family=Chiron+GoRound+TC:wght@400;500;700&amp;family=Nunito:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FBF4E8}
*{font-synthesis-weight:none}
*{box-sizing:border-box}
.hd{font-family:'LXGW Marker Gothic','Chiron GoRound TC',sans-serif;font-weight:400}
.num{font-family:Nunito,'Chiron GoRound TC',sans-serif;font-variant-numeric:tabular-nums}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:10px;background:#F3E7D4}
.seg a{display:flex;align-items:center;justify-content:center;height:36px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:500;color:#5A4A3C;text-decoration:none}
.seg a[aria-current="page"]{background:#FFFCF6;color:#3B2F25;font-weight:700;box-shadow:0 1px 2px rgba(59,47,37,.1)}
.tab-a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:56px;font-size:11px;text-decoration:none;color:#5A4A3C}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:11px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:3px}
.d{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;height:58px;padding-top:5px;border-radius:10px;border:1.5px solid transparent;background:transparent;font-family:inherit;color:#3B2F25;cursor:pointer}
:focus-visible{outline:2.5px solid #3E6270;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:844px;background:#FBF4E8;color:#3B2F25;font-family:'Chiron GoRound TC',sans-serif;position:relative;overflow:hidden;display:flex;flex-direction:column">
  <header style="display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-bottom:1.5px dashed #D9C7AC">
    <h1 class="hd" style="margin:0;font-size:22px">穿搭日記</h1>
    <nav class="seg" aria-label="檢視方式" style="margin-left:auto"><a href="B-M-Diary.dc.html" aria-current="page">月曆</a><a href="B-Diary-List.dc.html">列表</a></nav>
  </header>

  <section aria-labelledby="mcal" style="padding:8px 10px 0">
    <div style="display:flex;align-items:center;gap:2px;padding:0 4px">
      <button type="button" aria-label="上個月" style="width:44px;height:44px;border:0;background:none;color:#5A4A3C;display:flex;align-items:center;justify-content:center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px"><path d="M15 6l-6 6 6 6"></path></svg></button>
      <h2 id="mcal" class="hd" style="margin:0;font-size:20px"><span class="num" style="font-weight:700;font-size:19px">2026</span> 年 <span class="num" style="font-weight:700;font-size:19px">11</span> 月</h2>
      <button type="button" aria-label="下個月" style="width:44px;height:44px;border:0;background:none;color:#5A4A3C;display:flex;align-items:center;justify-content:center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px"><path d="M9 6l6 6-6 6"></path></svg></button>
      <span style="margin-left:auto;font-size:12px;color:#5A4A3C">記了 <b class="num" style="color:#3B2F25">8</b> 天</span>
    </div>
    <div role="grid" aria-labelledby="mcal" style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px">
      <sc-for list="{{wk}}" as="w" hint-placeholder-count="7"><span role="columnheader" style="height:24px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:{{w.c}}">{{w.t}}</span></sc-for>
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
        <button type="button" role="gridcell" class="d" aria-label="{{c.aria}}" aria-selected="{{c.sel}}" style="{{c.st}}">
          <span class="num" style="display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:20px;border-radius:6px;font-size:13px;font-weight:700;{{c.nst}}">{{c.n}}</span>
          <sc-if value="{{c.has}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position:relative;width:28px;height:24px"><span style="position:absolute;left:0;top:0;width:18px;height:16px;border-radius:5px;background:{{c.a}};transform:rotate(-8deg);box-shadow:0 1px 2px rgba(59,47,37,.2)"></span><span style="position:absolute;right:0;bottom:0;width:16px;height:16px;border-radius:5px;background:{{c.b}};transform:rotate(7deg);box-shadow:0 1px 2px rgba(59,47,37,.2)"></span></span></sc-if>
        </button>
      </sc-for>
    </div>
  </section>

  <article aria-labelledby="sel-t" style="margin:8px 12px 0;padding:12px;border-radius:16px;background:#FFFCF6;box-shadow:0 1px 0 rgba(59,47,37,.05),0 12px 24px -16px rgba(59,47,37,.3);display:flex;gap:12px;position:relative">
    <span aria-hidden="true" style="position:absolute;left:50%;top:-9px;width:70px;height:18px;margin-left:-35px;border-radius:2px;background:rgba(150,186,198,.6);mix-blend-mode:multiply;transform:rotate(-3deg)"></span>
    <a href="B-M-Diary-Day.dc.html" aria-label="查看 11 月 12 日的完整紀錄" style="position:relative;flex:0 0 104px;height:128px;border-radius:12px;background:rgba(150,186,198,.3);overflow:hidden">
      <sc-for list="{{parts}}" as="p" hint-placeholder-count="4"><svg viewBox="0 0 100 100" style="position:absolute;left:{{p.l}}%;top:{{p.t}}%;width:{{p.w}}%;transform:rotate({{p.r}}deg);filter:drop-shadow(0 3px 4px rgba(59,47,37,.2))" aria-hidden="true"><path d="{{p.d}}" fill="{{p.hex}}" stroke="rgba(59,47,37,.25)" stroke-width="1"></path></svg></sc-for>
    </a>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px">
      <span style="font-size:11px;color:#74624F">11 月 12 日（四）・雨 18°</span>
      <h3 id="sel-t" class="hd" style="margin:0;font-size:18px">雨天的季度簡報</h3>
      <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap"><span class="chip" style="background:#DCE8EC;color:#24424D">上班</span><span class="chip" style="background:#E6EEE2;color:#2E3F2B">舒服</span><span role="img" aria-label="評分 4 分（滿分 5 分）" style="display:inline-flex;gap:2px;margin-left:auto"><sc-for list="{{stars}}" as="s" hint-placeholder-count="5"><span style="width:10px;height:10px;border-radius:3px;transform:rotate(-8deg);background:{{s}}"></span></sc-for></span></div>
      <p style="margin:0;font-size:12px;line-height:1.55;color:#5A4A3C;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">外套擋風剛好；德訓鞋踩水有點濕，下雨天改穿短靴比較好。</p>
      <div style="display:flex;gap:6px;margin-top:auto">
        <a href="B-M-Outfit.dc.html" style="flex:1;display:flex;align-items:center;justify-content:center;gap:4px;height:40px;border-radius:10px;background:#F2CF8E;border:1.5px solid #E2B866;color:#3B2F25;font-size:13px;font-weight:500;text-decoration:none"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3M18 3v4h-4M6 21v-4h4"></path></svg>再穿一次</a>
        <a href="B-M-Diary-Day.dc.html" style="display:flex;align-items:center;justify-content:center;height:40px;padding:0 12px;border-radius:10px;border:1.5px solid #D9C7AC;background:#FFFCF6;color:#3B2F25;font-size:13px;font-weight:500;text-decoration:none">查看</a>
      </div>
    </div>
  </article>

  <a href="B-M-Diary-New.dc.html" aria-label="記一筆" style="position:absolute;right:16px;bottom:96px;width:56px;height:56px;border-radius:18px;background:#3B2F25;color:#FBF4E8;display:flex;align-items:center;justify-content:center;transform:rotate(-4deg);box-shadow:0 10px 20px -8px rgba(59,47,37,.5)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:26px;height:26px;transform:rotate(4deg)"><path d="M12 5v14M5 12h14"></path></svg></a>

  <nav aria-label="主要導覽" style="position:absolute;left:0;right:0;bottom:0;background:#FFFCF6;border-top:1.5px dashed #D9C7AC;padding:6px 8px 22px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end">
    <a class="tab-a" href="B-M-Home.dc.html"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"></path></svg>首頁</a>
    <a class="tab-a" href="B-Closet.dc.html"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7a2 2 0 1 1 2-2M12 7v2L3 16.5a1 1 0 0 0 .6 1.8h16.8a1 1 0 0 0 .6-1.8L12 9"></path></svg>衣櫃</a>
    <a class="tab-a" href="B-M-Outfit.dc.html" style="color:#3B2F25;gap:6px;height:auto;font-weight:700"><span style="width:58px;height:58px;border-radius:18px;background:#F2CF8E;border:1.5px solid #E2B866;color:#3B2F25;display:flex;align-items:center;justify-content:center;margin-top:-30px;transform:rotate(-4deg);box-shadow:0 8px 16px -6px rgba(124,90,30,.45)"><svg class="ic" viewBox="0 0 24 24" style="width:26px;height:26px;transform:rotate(4deg)" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM16.5 13v7M13 16.5h7"></path></svg></span>搭配</a>
    <a class="tab-a" href="B-M-Diary.dc.html" aria-current="page" style="color:#3B2F25;font-weight:700"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2zM5 18a2 2 0 0 1 2-2h12M9 8h6"></path></svg>日記</a>
    <a class="tab-a" href="B-M-Compare.dc.html"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"></path></svg>選購</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // 每天用「上衣色＋下身色」兩張小貼紙代表
    const E = { 2: ['#D9CBB3', '#8C9A86', '看展'], 3: ['#F4F1EA', '#8FA3BC', '外套配素 T'], 5: ['#D9CBB3', '#2E3A4F', '普通上班日'], 6: ['#6E2E34', '#2E3A4F', '朋友生日晚餐'], 8: ['#6E2E34', '#8C9A86', '週末市集'], 10: ['#F4F1EA', '#2E3A4F', '週二例會'], 11: ['#F4F1EA', '#8FA3BC', '圖書館一整天'], 12: ['#D9CBB3', '#8FA3BC', '雨天的季度簡報'] };
    const SEL = 12, TODAY = 12, cells = [];
    for (let i = 0; i < 35; i++) {
      const inM = i < 30, n = inM ? i + 1 : i - 29, e = inM ? E[n] : null, future = inM && n > TODAY;
      let st = !inM ? 'opacity:.35;' : future ? 'opacity:.5;' : '';
      if (e) st += 'background:#FFFCF6;';
      if (inM && n === SEL) st += 'border:2px solid #3B2F25;';
      cells.push({ n, has: !!e, a: e ? e[0] : '', b: e ? e[1] : '', st, sel: inM && n === SEL ? 'true' : 'false',
        nst: inM && n === TODAY ? 'border:1.5px dashed #3E6270;color:#24424D;' : '',
        aria: n + ' 日' + (inM && n === TODAY ? '（今天）' : '') + (e ? '，' + e[2] : '') });
    }
    const SH = {
      coat: 'M30 12L44 10L50 30L56 10L70 12L84 28L90 84L80 86L72 46L74 92H26L28 46L20 86L10 84L16 28Z',
      knit: 'M32 16L44 13Q50 19 56 13L68 16L80 30L88 78L78 80L70 42V86H30V42L22 80L12 78L20 30Z',
      pants: 'M32 10H68L72 90H56L50 36L44 90H28Z',
      shoe: 'M14 62V46Q24 44 34 52Q48 62 70 62Q86 62 88 72V76H14Z'
    };
    return {
      wk: ['日', '一', '二', '三', '四', '五', '六'].map((t, i) => ({ t, c: i === 0 || i === 6 ? '#8E4A3E' : '#74624F' })),
      cells,
      parts: [
        { d: SH.coat, hex: '#3D3D3B', l: 0, t: 8, w: 58, r: -8 },
        { d: SH.knit, hex: '#D9CBB3', l: 36, t: 2, w: 54, r: 4 },
        { d: SH.pants, hex: '#8FA3BC', l: 38, t: 38, w: 50, r: -2 },
        { d: SH.shoe, hex: '#EDE7DA', l: 52, t: 70, w: 44, r: -6 }
      ],
      stars: [1, 2, 3, 4, 5].map(i => i <= 4 ? '#F2CF8E' : '#EADCC6')
    };
  }
}
</script>
</body>
</html>
