    <label style="display:flex;align-items:center;gap:10px;font-size:14px;min-height:44px"><input type="checkbox" style="width:20px;height:20px;accent-color:#3B2F25">存好後繼續新增下一件</label>

  <footer style="position:absolute;left:0;right:0;bottom:0;padding:12px 16px 28px;background:#FBF4E8;border-top:1.5px dashed #D9C7AC">
    <a href="B-Closet.dc.html" style="display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:12px;background:#F2CF8E;border:1.5px solid #E2B866;color:#3B2F25;font:500 15px 'Chiron GoRound TC';text-decoration:none"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px"><path d="M5 12l5 5L20 7"></path></svg>放進衣櫃</a>
